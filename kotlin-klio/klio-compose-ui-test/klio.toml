# androidx.compose.ui.test: Compose's UI test harness, as Compose Desktop's
# tests run it: runComposeUiTest and runDesktopComposeUiTest over a skiko
# test scene, the semantics finders, assertions and actions, and the mouse,
# touch, key and trackpad input they inject. commonMain, skikoMain,
# nonJvmMain and nativeMain are upstream's whole; desktopMain's runner and
# click action are java-free and taken too. klioMain has the UI-thread
# actuals the desktop's take from Swing.
[library]
id = "androidx.compose.ui.test"
version = "1.12.0"
abi = 1
implicit_packages = []
auto_bindings = true

[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-test/src/commonMain/kotlin"

[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-test/src/skikoMain/kotlin"

[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-test/src/nonJvmMain/kotlin"

[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-test/src/nativeMain/kotlin"

[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-test/src/desktopMain/kotlin"
include = [
    "androidx/compose/ui/test/Actions.desktop.kt",
    "androidx/compose/ui/test/ComposeUiTest.desktop.kt",
    "androidx/compose/ui/test/v2/ComposeUiTest.desktop.kt",
]

[[source]]
root = "klioMain"

[deps]
stdlib = "*"
"androidx.annotation" = "*"
"androidx.collection" = "*"
"androidx.compose.runtime" = "*"
"androidx.compose.runtime.saveable" = "*"
"androidx.compose.ui" = "*"
"androidx.compose.ui.util" = "*"
"androidx.compose.ui.geometry" = "*"
"androidx.compose.ui.unit" = "*"
"androidx.compose.ui.graphics" = "*"
"androidx.compose.ui.text" = "*"
"org.jetbrains.skiko" = "*"
"kotlinx.atomicfu" = "*"
"kotlinx.coroutines" = { version = "*", features = ["core", "test"] }

# androidx.compose.ui — the real Compose UI engine (LayoutNode, the Modifier.Node
# chain, measure/layout/draw, Constraints/Placeable, pointer input, focus,
# semantics), vendored verbatim. klioMain supplies the platform actuals; the
# render path draws through the vendored androidx.compose.ui.graphics.Canvas
# (KlioCanvas). WIP: the node/layout tier is landing incrementally.
[library]
id = "androidx.compose.ui"
version = "1.11.1"
abi = 1
implicit_packages = []
auto_bindings = true


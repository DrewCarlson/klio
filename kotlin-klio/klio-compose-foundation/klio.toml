[[source]]
# Upstream's DESKTOP (skiko) source set: the real `actual`s for foundation's
# platform expects — key mapping, cursor/selection drawing, code-point helpers,
# context menu, clipboard, dead-key combining. klio IS a desktop Compose target,
# so these are vendored rather than reinvented. Curated like commonMain: only the
# files klio can lex + parse and whose dependencies the pack carries.
root = "../klio-compose-runtime/upstream/compose/foundation/foundation/src/skikoMain/kotlin"
include = [
    "androidx/compose/foundation/text/AutofillHighlight.skiko.kt",
    "androidx/compose/foundation/text/BasicSecureTextField.skiko.kt",
    "androidx/compose/foundation/text/BasicText.skiko.kt",

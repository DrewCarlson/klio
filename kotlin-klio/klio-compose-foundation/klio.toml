    "androidx/compose/foundation/text/contextmenu/internal/DefaultTextContextMenuDropdownProvider.skiko.kt",
    "androidx/compose/foundation/text/handwriting/StylusHandwriting.skiko.kt",
    "androidx/compose/foundation/text/input/TextObfuscationMode.skiko.kt",
    "androidx/compose/foundation/text/input/internal/LegacyPlatformTextInputServiceAdapter.skiko.kt",
    "androidx/compose/foundation/text/input/internal/TextFieldDragAndDropNode.skiko.kt",
    "androidx/compose/foundation/text/input/internal/TextFieldKeyEventHandler.skiko.kt",
    "androidx/compose/foundation/text/input/internal/TextFieldLayoutStateCache.skiko.kt",
    "androidx/compose/foundation/text/input/internal/TextInputSession.skiko.kt",
    "androidx/compose/foundation/text/input/internal/ToCharArray.skiko.kt",
    "androidx/compose/foundation/text/modifiers/SelectionController.skiko.kt",

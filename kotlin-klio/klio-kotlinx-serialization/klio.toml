[library]
id = "kotlinx.serialization"
version = "1.11.0"
abi = 1
implicit_packages = []
auto_bindings = true

# Upstream kotlinx-serialization-core 1.11.0 commonMain, consumed
# straight from the in-pack git submodule. `include` curates exactly
# the files klio can lex + parse: the public annotations / KSerializer
# / SerialDescriptor / encoding contracts plus the self-contained
# internal helpers. The reified-generic dispatch files
# (Serializers.kt, SerializersCache.kt, BuiltinSerializers.kt,
# Tuples.kt, CollectionSerializers.kt, SealedSerializer.kt,
# AbstractPolymorphicSerializer.kt, PluginGeneratedSerialDescriptor.kt,
# PolymorphicModuleBuilder.kt, SerializersModuleBuilders.kt) use
# `inline fun <reified T>` + complex generic bounds the klio parser
# does not yet accept and are excluded; the consumer-facing pieces
# klio needs from them are supplied by klioMain. Format modules
# (json/cbor/protobuf/hocon/properties) and JS/native intrinsics live
# in other source sets and are never walked.
[[source]]
root = "upstream/core/commonMain/src"
include = [
    "kotlinx/serialization/Annotations.kt",
    "kotlinx/serialization/ApiLevels.kt",
    "kotlinx/serialization/builtins/BuiltinSerializers.kt",
    "kotlinx/serialization/builtins/LongAsStringSerializer.kt",
    "kotlinx/serialization/ContextualSerializer.kt",
    "kotlinx/serialization/KSerializer.kt",
    "kotlinx/serialization/SerialFormat.kt",
    "kotlinx/serialization/SerializationExceptions.kt",
    "kotlinx/serialization/descriptors/ContextAware.kt",
    "kotlinx/serialization/descriptors/SerialDescriptor.kt",
    "kotlinx/serialization/descriptors/SerialDescriptors.kt",
    "kotlinx/serialization/descriptors/SerialKinds.kt",
    "kotlinx/serialization/encoding/AbstractDecoder.kt",
    "kotlinx/serialization/encoding/AbstractEncoder.kt",
    "kotlinx/serialization/encoding/ChunkedDecoder.kt",
    "kotlinx/serialization/encoding/Decoding.kt",
    "kotlinx/serialization/encoding/Encoding.kt",
    "kotlinx/serialization/internal/AbstractPolymorphicSerializer.kt",
    "kotlinx/serialization/internal/BuiltInSerializers.kt",
    "kotlinx/serialization/internal/CachedNames.kt",
    "kotlinx/serialization/internal/CollectionDescriptors.kt",
    "kotlinx/serialization/internal/CollectionSerializers.kt",
    "kotlinx/serialization/internal/ElementMarker.kt",
    "kotlinx/serialization/internal/Enums.kt",
    "kotlinx/serialization/internal/InlineClassDescriptor.kt",
    "kotlinx/serialization/internal/JsonInternalDependencies.kt",
    "kotlinx/serialization/internal/NamedCompanion.kt",
    "kotlinx/serialization/internal/NoOpEncoder.kt",
    "kotlinx/serialization/internal/NothingSerialDescriptor.kt",
    "kotlinx/serialization/internal/NullableSerializer.kt",
    "kotlinx/serialization/internal/ObjectSerializer.kt",
    "kotlinx/serialization/internal/Platform.common.kt",
    "kotlinx/serialization/internal/PluginExceptions.kt",
    "kotlinx/serialization/internal/PluginGeneratedSerialDescriptor.kt",
    "kotlinx/serialization/internal/PluginHelperInterfaces.kt",
    "kotlinx/serialization/internal/PrimitiveArraysSerializers.kt",
    "kotlinx/serialization/internal/Primitives.kt",
    "kotlinx/serialization/internal/SerializationConstructorMarker.kt",
    "kotlinx/serialization/internal/Tagged.kt",
    "kotlinx/serialization/internal/Tuples.kt",
    "kotlinx/serialization/internal/ValueClasses.kt",
    "kotlinx/serialization/PolymorphicSerializer.kt",
    "kotlinx/serialization/SealedSerializer.kt",
    "kotlinx/serialization/Serializers.kt",
    "kotlinx/serialization/SerializersCache.kt",
    "kotlinx/serialization/modules/PolymorphicModuleBuilder.kt",
    "kotlinx/serialization/modules/SerializersModule.kt",
    "kotlinx/serialization/modules/SerializersModuleBuilders.kt",
    "kotlinx/serialization/modules/SerializersModuleCollector.kt",
]

# Upstream kotlinx-serialization-json 1.11.0 commonMain, consumed
# verbatim (Json : StringFormat, streaming/tree codecs, JsonElement,
# builders, naming strategies). Packed here; the `json` feature below
# gates it at load, together with the klio actuals for its `expect`s
# under klioMain/kotlinx/serialization/json.
[[source]]
root = "upstream/formats/json/commonMain/src"

# klio-supplied layer: marker annotations / runtime helpers that the
# excluded reified-generic upstream files would otherwise provide,
# plus actuals for the internal `expect`s in Platform.common.kt and
# the reflective `serializer()` entrypoints (the compiler-plugin
# replacement; backed by the host intrinsics in src/kotlinx_serialization).
# json-io (formats/json-io): `Json.encodeToSink` / `decodeFromSource` over
# kotlinx.io Source/Sink. Collected here; gated to the `json` feature so it
# loads only with `--feature kotlinx.serialization/json` (which pulls the
# kotlinx.io pack its Source/Sink/Buffer types come from).
[[source]]
root = "upstream/formats/json-io/commonMain/src"

[[source]]
root = "klioMain"

[[deps]]
id = "stdlib"

# Cargo-style features mirroring kotlinx-serialization's Gradle modules.
# The reflective serialization-core (annotations, KSerializer,
# descriptors, encoding) is the ungated core, always loaded. The JSON
# format is upstream kotlinx-serialization-json's commonMain verbatim
# (Json : StringFormat, the streaming/tree codecs, JsonElement) plus the
# klio actuals for its five `expect`s under klioMain/.../json; opt-in
# via `--feature kotlinx.serialization/json`.
[features]
default = []
json = { sources = ["upstream/formats/json/commonMain/src", "upstream/formats/json-io/commonMain/src", "klioMain/kotlinx/serialization/json"], deps = ["kotlinx.io"] }

# commonTest sources for `klio test` (not packed).
[[test]]
root = "upstream/core/commonTest"

# klio-authored platform actual for the commonTest support surface
# (`expect val currentPlatform`); see klioTest/ for why NATIVE.
[[test]]
root = "klioTest"

# Upstream's JSON test suite (formats/json-tests), gated on the `json`
# feature. Its OKIO streaming mode runs upstream's json-okio adapter module
# unchanged over the klioTest/json stand-in for the okio buffer type the
# pack does not ship; the KXIO mode runs the pack's own json-io module over
# the real kotlinx.io pack.
[[test]]
root = "upstream/formats/json-okio/commonMain/src"
feature = "json"

[[test]]
root = "upstream/formats/json-tests/commonTest/src"
feature = "json"

# androidx.compose.material3 — the Material 3 component library, vendored
# verbatim: every commonMain file, the skiko actuals (dialogs, menus, popups,
# the bottom sheet, tooltips, the date and time pickers' calendar model over
# kotlinx-datetime, the localized strings and their translations) and the
# non-JVM ones. klioMain holds what no upstream source set serves on klio:
# the CalendarLocale and PlatformDateFormat actuals over the host's ICU, and
# identityHashCode.
[library]
id = "androidx.compose.material3"
version = "1.12.0"
abi = 1
implicit_packages = []
auto_bindings = true

[[source]]
root = "../klio-compose-runtime/upstream/compose/material3/material3/src/commonMain/kotlin"

[[source]]
root = "../klio-compose-runtime/upstream/compose/material3/material3/src/skikoMain/kotlin"

[[source]]
root = "../klio-compose-runtime/upstream/compose/material3/material3/src/nonJvmMain/kotlin"

[[source]]
root = "klioMain"

[deps]
stdlib = "*"
"androidx.annotation" = "*"
"androidx.compose.runtime" = "*"
"androidx.compose.runtime.saveable" = "*"
"androidx.compose.ui" = "*"
"androidx.compose.ui.unit" = "*"
"androidx.compose.ui.geometry" = "*"
"androidx.compose.ui.graphics" = "*"
"androidx.compose.ui.text" = "*"
"androidx.compose.ui.util" = "*"
"androidx.compose.foundation" = "*"
"androidx.compose.foundation.layout" = "*"
"androidx.compose.animation.core" = "*"
"androidx.compose.animation" = "*"
"androidx.collection" = "*"
"androidx.graphics.shapes" = "*"
"androidx.compose.material.ripple" = "*"
"androidx.compose.ui.backhandler" = "*"
"kotlinx.coroutines" = "*"
"kotlinx.datetime" = "*"
"kotlinx.atomicfu" = "*"


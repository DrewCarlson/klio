[library]
# androidx.compose.runtime — the Compose Multiplatform runtime. A pack is
# selected when a user import prefix-matches its id, so importing any
# `androidx.compose.runtime.*` symbol pulls this pack in.
id = "androidx.compose.runtime"
version = "1.12.0"
abi = 1
implicit_packages = []
auto_bindings = true

# The whole upstream commonMain (compose-multiplatform-core v1.12.0): the
# composer, slot tables, recomposer, snapshot system, effects and tooling, with
# the bundled persistent immutable collections. klio has no compiler plugin;
# the interpreter threads an implicit composer and positional group keys, and
# `currentComposer` resolves to it.
[[source]]
root = "../klio-compose-runtime/upstream/compose/runtime/runtime/src/commonMain/kotlin"

# nonAndroidMain: the snapshot state factories, the array copy, the trace and
# the main-thread id.
[[source]]
root = "../klio-compose-runtime/upstream/compose/runtime/runtime/src/nonAndroidMain/kotlin"

# nonJvmMain: the atomics, the composite key hash, the diagnostic exception,
# the cancellation base and the annotations. The tracing context and the
# snapshot context element come from jvmAndAndroidMain instead, since klio's
# coroutines have ThreadContextElement; invokeComposable and logError are
# klio's (engineMain, klioMain).
[[source]]
root = "../klio-compose-runtime/upstream/compose/runtime/runtime/src/nonJvmMain/kotlin"
exclude = [
    "androidx/compose/runtime/TracingContext.nonJvm.kt",
    "androidx/compose/runtime/snapshots/SnapshotContextElement.nonJvm.kt",
    "androidx/compose/runtime/internal/Utils.nonJvm.kt",
]

# jvmAndAndroidMain: the actuals that are plain Kotlin over kotlinx.coroutines
# and androidx.collection, as the desktop runs them.
[[source]]
root = "../klio-compose-runtime/upstream/compose/runtime/runtime/src/jvmAndAndroidMain/kotlin"
include = [
    "androidx/compose/runtime/TracingContext.jvmAndAndroid.kt",
    "androidx/compose/runtime/snapshots/SnapshotContextElement.jvmAndAndroid.kt",
    "androidx/compose/runtime/snapshots/SnapshotId.jvmAndAndroid.kt",
]

# nativeMain: the weak reference, over kotlin.native.ref.
[[source]]
root = "../klio-compose-runtime/upstream/compose/runtime/runtime/src/nativeMain/kotlin"
include = ["androidx/compose/runtime/internal/WeakReference.native.kt"]

# klio's layer: the platform actuals no shipped upstream source set covers
# here (thread ids, identity hash, locks, the desktop frame
# clock, error logging), the runtime-annotation and runtime-retain surfaces,
# and the host-intrinsic entrypoints (backed by src/compose_runtime).
[[source]]
root = "klioMain"

# The composable-lambda and invokeComposable actuals for the implicit composer.
[[source]]
root = "engineMain"

[deps]
stdlib = "*"
"androidx.annotation" = "*"
# The coroutine-backed effects (rememberCoroutineScope / LaunchedEffect /
# produceState) build on the kotlinx.coroutines pack.
"kotlinx.coroutines" = "*"
# The compose runtime's common code (frame clock, AwaiterQueue, snapshot
# system, collections) is built on androidx.collection.
"androidx.collection" = "*"
"kotlinx.atomicfu" = "*"


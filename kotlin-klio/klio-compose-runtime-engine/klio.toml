# The bundled persistent immutable collections
# (androidx.compose.runtime.external.kotlinx.collections.immutable): a pure
# stdlib library the snapshot state objects are built on. Its own source root so
# every file ships without an include list.
[[source]]
root = "../klio-compose-runtime/upstream/compose/runtime/runtime/src/commonMain/kotlin"
include = [
    "androidx/compose/runtime/external/kotlinx/collections/immutable/",
]

# nonAndroidMain: the platform actuals for the snapshot state objects.
[[source]]
root = "../klio-compose-runtime/upstream/compose/runtime/runtime/src/nonAndroidMain/kotlin"
include = [
    "androidx/compose/runtime/snapshots/SnapshotStateList.nonAndroid.kt",
    "androidx/compose/runtime/snapshots/SnapshotStateSet.nonAndroid.kt",
    "androidx/compose/runtime/SnapshotState.nonAndroid.kt",
    "androidx/compose/runtime/SnapshotIntState.nonAndroid.kt",
    "androidx/compose/runtime/SnapshotLongState.nonAndroid.kt",
    "androidx/compose/runtime/SnapshotFloatState.nonAndroid.kt",
    "androidx/compose/runtime/SnapshotDoubleState.nonAndroid.kt",
    "androidx/compose/runtime/internal/Trace.nonAndroid.kt",
]

# klio-supplied layer: the composer / composition / recomposer / snapshot-state
# engine reimplemented in plain Kotlin, plus actuals for the platform/atomic
# `expect`s and the host-intrinsic entrypoints (backed by src/compose_runtime).
[[source]]
root = "../klio-compose-runtime/klioMain"
# Engine variant: only platform actuals + klio-specific annotations/host
# bridges kept; composer/composition/effects/tooling supplied by upstream.
include = [
    "androidx/compose/runtime/collection/ArrayUtils.kt",
    "androidx/compose/runtime/internal/Atomic.kt",
    "androidx/compose/runtime/internal/Thread.kt",
    "androidx/compose/runtime/internal/WeakReference.kt",
    "androidx/compose/runtime/internal/JvmDefaultWithCompatibility.kt",
    "androidx/compose/runtime/platform/Synchronization.kt",
    "androidx/compose/runtime/snapshots/SnapshotContextElementActual.kt",
    "androidx/compose/runtime/snapshots/SnapshotIdActuals.kt",
    "androidx/compose/runtime/HostIntrinsics.kt",
    "androidx/compose/runtime/Stability.kt",
    "androidx/compose/runtime/StateObservation.kt",
]
# Engine-only actuals for upstream expects the implicit-composer pack does
# not ship (invokeComposable). Not referenced by the original pack.
[[source]]
root = "engineMain"

[[deps]]
id = "stdlib"
# The coroutine-backed effects (rememberCoroutineScope / LaunchedEffect /
# produceState) build on the kotlinx.coroutines pack.
[[deps]]
id = "kotlinx.coroutines"
# The compose runtime's common code (frame clock, AwaiterQueue, snapshot
# system, collections) is built on androidx.collection.
[[deps]]
id = "androidx.collection"

[library]
id = "kotlinx.coroutines"
version = "1.11.0"
abi = 1
implicit_packages = []
auto_bindings = true

[[source]]
root = "upstream/kotlinx-coroutines-core/common/src"

[[source]]
root = "klioMain"

# kotlinx-coroutines-test (`kotlinx.coroutines.test.*`): TestScope /
# TestDispatcher / TestCoroutineScheduler and the `runTest` builder, plus
# the native actuals (TestResult = Unit, createTestResult = runBlocking).
[[source]]
root = "upstream/kotlinx-coroutines-test/common/src"

[[source]]
root = "klioTest"

[[deps]]
id = "stdlib"

[[test]]
root = "upstream/kotlinx-coroutines-core/common/test"

# Shared commonTest infrastructure and the non-JS Unit-returning platform
# actuals used by the core test tree.
[[test]]
root = "upstream/test-utils/common/src"

[[test]]
root = "upstream/test-utils/wasmWasi/src"

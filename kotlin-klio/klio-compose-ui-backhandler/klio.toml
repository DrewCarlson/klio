# androidx.compose.ui.backhandler — the upstream ui-backhandler module:
# BackHandler and PredictiveBackHandler, registered with the scene's
# navigation event dispatcher (androidx.navigationevent). material3's skiko
# actuals call it. Vendored verbatim: commonMain and the non-Android jbMain.
[library]
id = "androidx.compose.ui.backhandler"
version = "1.12.0"
abi = 1
implicit_packages = []
auto_bindings = true

[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-backhandler/src/commonMain/kotlin"

[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-backhandler/src/jbMain/kotlin"

[deps]
stdlib = "*"
"androidx.annotation" = "*"
"androidx.compose.runtime" = "*"
"androidx.compose.ui.util" = "*"
"androidx.navigationevent" = "*"
"androidx.navigationevent.compose" = "*"
"kotlinx.coroutines" = "*"

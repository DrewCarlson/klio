[library]
id = "kotlinx.io"
version = "0.9.1"
abi = 1
implicit_packages = []
auto_bindings = true

# Real upstream kotlinx-io 0.9.1 commonMain, consumed directly from
# the in-pack git submodule at `upstream/` (no vendored copies). The
# curated `include` set is exactly the common sources klio's
# `klioMain` actuals satisfy; the rest of the upstream tree (platform
# source sets, tests) is excluded by omission. Bumping the version =
# updating the submodule + reviewing this list.

# kotlinx-io-core: Buffer, the Source/Sink hierarchy, UTF-8, and the
# `kotlinx.io.files` filesystem surface.
[[source]]
root = "upstream/core/common/src"
include = [
    "-CommonPlatform.kt",
    "-Util.kt",
    "Annotations.kt",
    "Buffer.kt",
    "Buffers.kt",
    "ByteStrings.kt",
    "Core.kt",
    "PeekSource.kt",
    "RawSink.kt",
    "RawSource.kt",
    "RealSink.kt",
    "RealSource.kt",
    "Segment.kt",
    "SegmentPool.kt",
    "Sink.kt",
    "Sinks.kt",
    "Source.kt",
    "Sources.kt",
    "Utf8.kt",
    "internal/-Utf8.kt",
    "unsafe/UnsafeBufferOperations.kt",
    "files/FileSystem.kt",
    "files/Paths.kt",
]

# kotlinx-io-bytestring: the immutable ByteString and its builder / codecs.
[[source]]
root = "upstream/bytestring/common/src"
include = [
    "-Platform.kt",
    "ByteString.kt",
    "ByteStringBuilder.kt",
    "Base64.kt",
    "Hex.kt",
    "unsafe/Annotations.kt",
    "unsafe/UnsafeByteStringOperations.kt",
]

# klio-authored platform actuals for both modules; the package path places a
# file in its module (`kotlinx/io/bytestring/` actualises bytestring).
[[source]]
root = "klioMain"

[deps]
stdlib = "*"

# One feature per upstream module. `core` (kotlinx-io-core) is the default;
# it is built on `bytestring` (kotlinx-io-bytestring), which a consumer can
# take alone with `default_features = false`.
[features]
default = ["core"]
bytestring = { sources = ["upstream/bytestring", "klioMain/kotlinx/io/bytestring"] }
core = { sources = ["upstream/core", "klioMain"], requires = ["bytestring"] }

# commonTest sources for `klio test` (not packed), each module's own suite
# under its feature. `klioTest` actualises the two `expect`s the core suite
# declares (temp files, UTF-8 round trips).
[[test]]
root = "upstream/core/common/test"
feature = "core"

[[test]]
root = "klioTest"
feature = "core"

[[test]]
root = "upstream/bytestring/common/test"
feature = "bytestring"

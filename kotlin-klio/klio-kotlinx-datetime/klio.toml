[library]
id = "kotlinx.datetime"
version = "0.8.0"
abi = 1
implicit_packages = []
auto_bindings = true

# Upstream kotlinx-datetime 0.8.0 core commonMain, consumed straight
# from the in-pack git submodule. `include` curates the files klio can
# parse + run: the self-contained Month / DayOfWeek enums + factories,
# the public exception types, and the LocalDate / LocalTime /
# LocalDateTime value types. The value-type files declare `expect
# class` + non-expect arithmetic/extension helpers; klioMain supplies
# the matching `actual class` (the `actual` keyword on the class drives
# klio's expect/actual supersession). The format-DSL members on those
# classes (`parse(CharSequence, DateTimeFormat)`, `Format { ... }`,
# `Formats.ISO`) are intentionally left without an actual: they are
# never reached at runtime, and klio tolerates unresolved references in
# uninvoked code paths.
#
# Still klio-supplied (excluded), with the exact per-file blocker:
#  - Instant.kt    : `import kotlin.time.Instant` — datetime 0.8.0
#                     moved Instant to the kotlin stdlib; the file is
#                     all extensions on `kotlin.time.Instant` and its
#                     bodies use `kotlin.time.Duration` builders
#                     (`.seconds`/`.nanoseconds`). klio has no
#                     kotlin.time. (Instant supplied by klioMain.)
#  - Clock.kt      : `import kotlin.time.Clock` / `kotlin.time.Instant`
#                     / `kotlin.time.isDistantFuture` /
#                     `kotlin.time.Duration.Companion.seconds`.
#  - DateTimePeriod.kt : `import kotlin.time.Duration` + uses it.
#  - DateTimeUnit.kt   : non-expect class member `public val duration:
#                     Duration` (kotlin.time.Duration) +
#                     `import kotlin.time.Duration.Companion.nanoseconds`.
#  - TimeZone.kt   : `expect open class TimeZone` with member
#                     extension funcs `Instant.toLocalDateTime()` /
#                     `LocalDateTime.toInstant()`, companion `UTC:
#                     FixedOffsetTimeZone`, `serializer():
#                     KSerializer<TimeZone>`; non-expect
#                     `Instant.offsetIn` needs `UtcOffset` +
#                     `FixedOffsetTimeZone` (the typealias `ZoneOffset
#                     = FixedOffsetTimeZone`). Consuming it would be a
#                     net-add of UtcOffset/FixedOffsetTimeZone actuals
#                     (no klioMain shrink) and pulls kotlin.time.Instant
#                     semantics; left supplied.
#  - UtcOffset.kt / YearMonth.kt : `expect class` + format DSL +
#                     serializers; not in klioMain and not exercised —
#                     consuming is a pure net-add with no run path.
#  - LocalDateRange.kt / LocalIsoWeekDate.kt / serializers/*.kt :
#                     depend on `kotlinx.datetime.internal.*`, the
#                     format parser-combinator DSL, or
#                     reified-generic serializer factories klio lacks.
#
# A `kotlin.time` shim (Duration/Instant/Clock) is the single blocker
# for Instant/Clock/DateTimePeriod/DateTimeUnit; it is a large
# subsystem and intentionally not built here. The pack depends on
# kotlinx.serialization so datetime value types stay reflectively
# `@Serializable`-serializable.
[[source]]
root = "upstream/core/common/src"
include = [
    "Month.kt",
    "DayOfWeek.kt",
    "Exceptions.kt",
    "OverloadMarker.kt",
    "LocalTime.kt",
    "LocalDate.kt",
    "LocalDateTime.kt",
    "DeprecatedInstant.kt",
    "DeprecatedClock.kt",
    "DateTimePeriod.kt",
    "Instant.kt",
    "Clock.kt",
    "LocalDateRange.kt",
    "YearMonthRange.kt",
    "LocalIsoWeekDate.kt",
    "DateTimeUnit.kt",
    "internal/math.kt",
    "internal/dateCalculations.kt",
    "internal/util.kt",
    "internal/BinaryDataReader.kt",
    "internal/toKotlinCode.kt",
    "internal/format/Builder.kt",
    "internal/format/FieldSpec.kt",
    "internal/format/Predicate.kt",
    "internal/format/FieldFormatDirective.kt",
    "internal/format/FormatStructure.kt",
    "internal/format/formatter/Formatter.kt",
    "internal/format/formatter/FormatterOperation.kt",
    "internal/format/parser/ParseResult.kt",
    "internal/format/parser/NumberConsumer.kt",
    "internal/format/parser/Parser.kt",
    "internal/format/parser/ParserOperation.kt",
    "format/DateTimeFormat.kt",
    "format/DateTimeFormatBuilder.kt",
    "format/LocalTimeFormat.kt",
    "format/LocalDateFormat.kt",
    "format/YearMonthFormat.kt",
    "format/LocalDateTimeFormat.kt",
    "format/UtcOffsetFormat.kt",
    "format/DateTimeComponents.kt",
    "format/Unicode.kt",
]

# The TZif reader and the recurring-rule model upstream writes in Kotlin.
# klio's own TimeZone conversions are native (see src/kotlinx_datetime), but
# these types are part of the library's surface and its own tests read a
# zoneinfo blob through them, so they are packed as ordinary sources.
[[source]]
root = "upstream/core/commonKotlin/src"
include = [
    "internal/Tzfile.kt",
    "internal/TimeZoneRules.kt",
    "internal/MonthDayTime.kt",
    "internal/OffsetInfo.kt",
]

# klio-supplied platform layer. The `actual class` bodies for the
# upstream `expect class` LocalDate / LocalTime / LocalDateTime, plus
# the still-supplied Instant / TimeZone / Duration / Clock /
# DateTimePeriod / DateTimeUnit and the conversion extensions. Bodies
# are thin Kotlin over the native host bindings in src/kotlinx_datetime (system
# clock, chrono-backed tz conversion, ISO parse/format, calendar
# arithmetic) plus standard proleptic-Gregorian day arithmetic for the
# LocalDate epoch/day-of-week/day-of-year accessors. Month / DayOfWeek
# are NOT redeclared here; they come from the upstream files above.
[[source]]
root = "klioMain"

[[deps]]
id = "stdlib"

[[deps]]
id = "kotlinx.serialization"

# commonTest sources for `klio test` (not packed).
[[test]]
root = "upstream/core/common/test"
[[test]]
root = "upstream/core/commonKotlin/test"

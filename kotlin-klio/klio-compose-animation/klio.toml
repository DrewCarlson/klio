# androidx.compose.animation — the upstream `animation` module, the layer above
# animation-core: single-value animations over Color, the spline-based fling
# decay physics the foundation scroll containers use, and the composable
# transition and visibility surface (AnimatedVisibility, EnterTransition /
# ExitTransition, Crossfade, AnimatedContent, the shared-element transitions).
# Vendored verbatim from compose-multiplatform-core (the sparse submodule hosted
# by ../klio-compose-runtime), with the non-Android and non-JVM actuals. A
# dependency of compose.foundation and material3.
[library]
id = "androidx.compose.animation"
version = "1.12.0"
abi = 1
implicit_packages = []
auto_bindings = true

# The whole commonMain source set.
[[source]]
root = "../klio-compose-runtime/upstream/compose/animation/animation/src/commonMain/kotlin"

# nonAndroidMain: the default decay and the spline-based fling decay;
# nonJvmMain: the JVM-default marker.
[[source]]
root = "../klio-compose-runtime/upstream/compose/animation/animation/src/nonAndroidMain/kotlin"

[[source]]
root = "../klio-compose-runtime/upstream/compose/animation/animation/src/nonJvmMain/kotlin"

[deps]
stdlib = "*"
"androidx.annotation" = "*"
"androidx.compose.runtime" = "*"
"androidx.compose.animation.core" = "*"
"androidx.compose.ui" = "*"
"androidx.compose.ui.unit" = "*"
"androidx.compose.ui.util" = "*"
"androidx.compose.ui.geometry" = "*"
"androidx.compose.ui.graphics" = "*"
"androidx.compose.ui.text" = "*"
"androidx.compose.foundation.layout" = "*"
"androidx.collection" = "*"
"kotlinx.coroutines" = "*"

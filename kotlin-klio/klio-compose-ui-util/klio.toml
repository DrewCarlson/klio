# androidx.compose.ui:ui-util — the compose UI math + inline-class helper module,
# vendored verbatim from the compose-multiplatform-core submodule. One klio pack
# per upstream Gradle module: this is the leaf `androidx.compose.ui.util` package
# the geometry / unit / graphics modules build on (packFloats/lerp/fastCoerceIn,
# the fast list helpers, the inline-class bit helpers). The klioMain layer
# supplies the platform `expect` actuals (float-bit helpers, fastRoundToInt,
# no-op tracing).
[library]
id = "androidx.compose.ui.util"
version = "1.11.1"
abi = 1
implicit_packages = []
auto_bindings = true

[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-util/src/commonMain/kotlin"
include = [
    "androidx/compose/ui/util/MathHelpers.kt",
    "androidx/compose/ui/util/ListUtils.kt",
    "androidx/compose/ui/util/InlineClassHelper.kt",
]

# klioMain: the platform `expect` actuals (float bits, fastRoundToInt, tracing).
[[source]]
root = "klioMain"

[[deps]]
id = "stdlib"
# ListUtils' fast collection helpers build on androidx.collection.
[[deps]]
id = "androidx.collection"

# androidx.compose.ui:ui-util — the compose UI math + inline-class helper module,
# vendored verbatim from the compose-multiplatform-core submodule. One klio pack
# per upstream Gradle module: this is the leaf `androidx.compose.ui.util` package
# the geometry / unit / graphics modules build on (packFloats/lerp/fastCoerceIn,
# the fast list helpers, the inline-class bit helpers), with the non-JVM
# actuals. klioMain supplies the no-op tracing the desktop target has.
[library]
id = "androidx.compose.ui.util"
version = "1.12.0"
abi = 1
implicit_packages = []
auto_bindings = true

[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-util/src/commonMain/kotlin"
include = [
    "androidx/compose/ui/util/MathHelpers.kt",
    "androidx/compose/ui/util/ListUtils.kt",
    "androidx/compose/ui/util/InlineClassHelper.kt",
    "androidx/compose/ui/util/Trace.kt",
    # The compose-ui opt-in markers every ui module annotates with.
    "androidx/compose/ui/ExperimentalComposeUiApi.kt",
    "androidx/compose/ui/ExperimentalIndirectPointerApi.kt",
    "androidx/compose/ui/ExperimentalMediaQueryApi.kt",
    "androidx/compose/ui/InternalComposeUiApi.kt",
]

# nonJvmMain: the float/double bit helpers every non-JVM target shares.
[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-util/src/nonJvmMain/kotlin"

# klioMain: tracing, a no-op as on the desktop target.
[[source]]
root = "klioMain"

[deps]
stdlib = "*"
# ListUtils' fast collection helpers build on androidx.collection.
"androidx.collection" = "*"


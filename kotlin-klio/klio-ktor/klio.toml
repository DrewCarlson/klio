[library]
# Umbrella id for the whole ktor surface this pack ships
# (`io.ktor.client.*`, `io.ktor.server.*`, `io.ktor.http.*`,
# `io.ktor.serialization.*`). A pack is selected when a user import
# prefix-matches its id, so the umbrella lets a server-only program
# (which never imports `io.ktor.client.*`) still load the pack.
id = "io.ktor"
version = "3.5.2"
abi = 1
implicit_packages = []
auto_bindings = true

# ktor-io: the byte channels, the packet and pool layer, charsets and locks.
# Common, nonJvm and jvmAndPosix run verbatim. klio replaces, under
# klioMain/io/ktor/utils/io: `ByteChannel.kt` (a copy with the close-cause
# rethrow in `awaitContent`), the lock, IO-dispatcher, byte-order and
# `PosixException` actuals, and the charset codec terminals, which upstream
# binds to iconv through cinterop. The posix operations over native pointers
# (`CPointer` reads and writes) have no klio counterpart.
[[source]]
root = "upstream/ktor-io/common/src"
exclude = [
    "io/ktor/utils/io/ByteChannel.kt",
]

[[source]]
root = "upstream/ktor-io/posix/src"
exclude = [
    "io/ktor/utils/io/ByteReadChannelOperations.posix.kt",
    "io/ktor/utils/io/ByteWriteChannelOperations.posix.kt",
    "io/ktor/utils/io/IODispatcher.posix.kt",
    "io/ktor/utils/io/Input.posix.kt",
    "io/ktor/utils/io/locks/Synchronized.kt",
    "io/ktor/utils/io/core/ByteOrderNative.kt",
    "io/ktor/utils/io/core/BytePacketBuilderOperations.posix.kt",
    "io/ktor/utils/io/errors/PosixErrors.kt",
]

[[source]]
root = "upstream/ktor-io/nonJvm/src"

[[source]]
root = "upstream/ktor-io/jvmAndPosix/src"

# ktor-utils: text and collection helpers, Attributes, the pipeline runtime,
# dates, crypto, logging and encoders. Common runs verbatim. klio replaces,
# under klioMain/io/ktor/util, the posix files that reach the platform
# through cinterop: the nonce source and `Digest` (CryptoNative), the GMTDate
# clock (DateNative), `KtorSimpleLogger` (its `getenv`), `DISABLE_SFG`
# (PipelineContext.posix) and the signal-based `ThreadInfo`. The gzip and
# deflate encoders, identity encoders on posix, compress for real over host
# natives (ContentEncodersKlio).
[[source]]
root = "upstream/ktor-utils/common/src"

[[source]]
root = "upstream/ktor-utils/posix/src"
exclude = [
    "io/ktor/util/ContentEncodersNative.kt",
    "io/ktor/util/CryptoNative.kt",
    "io/ktor/util/ThreadInfo.kt",
    "io/ktor/util/date/DateNative.kt",
    "io/ktor/util/logging/KtorSimpleLoggerNative.kt",
    "io/ktor/util/pipeline/PipelineContext.posix.kt",
]

# ktor-http: URLs, headers, content types, cookies, the body content model,
# the header grammar and the auth header model, verbatim.
[[source]]
root = "upstream/ktor-http/common/src"

# ktor-http-cio: the CIO message parser and multipart reader the client's
# default response transform reads multipart bodies with. Pure Kotlin on
# every platform; gated under the `http-cio` feature.
[[source]]
root = "upstream/ktor-http/ktor-http-cio/common/src"

[[source]]
root = "upstream/ktor-http/ktor-http-cio/jvmAndPosix/src"

[[source]]
root = "upstream/ktor-http/ktor-http-cio/posix/src"

# ktor-client-core nonJvm: the `engines` registry the default engine is found
# through, the timeout exceptions, the engine-dispatcher switch,
# `unwrapCancellationException` and the static platform config.
[[source]]
root = "upstream/ktor-client/ktor-client-core/nonJvm/src"

# ktor-client-core posix: the `ProxyConfig` actual, the default-transform
# actuals, the response observer's context, the posix coroutine utils and the
# engine-less `HttpClient()`, which takes the first engine in the `engines`
# list that the engine modules' `@EagerInitialization` hooks fill.
[[source]]
root = "upstream/ktor-client/ktor-client-core/posix/src"

# ktor-client-core jvmAndPosix: `checkContentLength` and the Unix-socket
# request builders.
[[source]]
root = "upstream/ktor-client/ktor-client-core/jvmAndPosix/src"

# ktor-sse: the server-sent event model both SSE plugins are built on.
[[source]]
root = "upstream/ktor-shared/ktor-sse/common/src"

# ktor-websockets: the frame model, the raw and default sessions, ping/pong
# and extensions. Common and posix are plain Kotlin. The permessage-deflate

# klio-authored actuals for every module, placed in their module by package
# path: `io/ktor/utils/io` (ktor-io: locks, the terminal codecs, the
# IO dispatcher, the ByteChannel actual), `io/ktor/util` (ktor-utils: crypto,
# GMTDate, the logger, the pipeline engine), `io/ktor/client` (the
# `KlioClient` name for the CIO engine), `io/ktor/server` (ktor-server-core: the engine
# over `__kktor_serve`, environment / shutdown / application-utils and
# hostname-escape actuals).
[[source]]
root = "klioMain"

# Default auto-binding prefix is `io.ktor.`, covering both the client
# (`io.ktor.client.engine.*`) and server (`io.ktor.server.engine.*`)
# native engine helpers.

[deps]
stdlib = "*"
# Pipeline runtime deps: coroutines (`PipelineContext : CoroutineScope`,
# suspend `proceed`) and atomicfu (`Pipeline`'s `by atomic(...)`).
"kotlinx.coroutines" = "*"
"kotlinx.atomicfu" = "*"
# `io.ktor.utils.io` channel types (`ByteReadChannel`/`ByteWriteChannel`) and
# the `OutgoingContent` body layer are backed by kotlinx.io `Buffer`/`Source`.
"kotlinx.io" = "*"

# Features mirror ktor's Gradle module structure: one feature per ktor
# module, named after the artifact with `ktor-` stripped, all opt-in via
# `--feature io.ktor/<name>`. Nothing loads by default. `requires` carries
# each module's upstream `api` dependencies inside ktor, so enabling
# `client-core` activates http -> utils -> io, events, sse, and serialization
# -> websockets: the closure the Gradle artifact resolves. `deps` names the
# features of other packs a module is built on.
[features]
default = []

# ktor-io (`io.ktor.utils.io.*`): the channel layer (the fully-buffered
# read side + the async `ByteChannel` Slot state machine and write side),
# locks, and charsets. klio supplies the `locks` / `ioDispatcher` /
# terminal-codec actuals.
[features.io]
sources = [
    "upstream/ktor-io/",
    "klioMain/io/ktor/utils/io/",
]

# ktor-utils (`io.ktor.util.*`): string/collection helpers,
# CaseInsensitiveMap, Attributes, GMTDate, the pipeline runtime, and
# logging. klio supplies the platform / concurrent-map / date / logger
# actuals. Depends on ktor-io.
[features.utils]
sources = [
    "upstream/ktor-utils/",
    "klioMain/io/ktor/util/",
    "klioMain/klio/logging/",
    "klioMain/klio/security/",
]
requires = ["io"]

# ktor-http (`io.ktor.http.*`): status codes, methods, headers, content
# types, URLs, and the `OutgoingContent` body layer. Depends on
# ktor-utils (and ktor-io through it).
[features.http]
sources = ["upstream/ktor-http/", "klioMain/io/ktor/http/"]
requires = ["utils"]

# ktor-http-cio (`io.ktor.http.cio.*`): the CIO HTTP message parser and the
# multipart reader. Depends on ktor-http.
[features.http-cio]
sources = ["upstream/ktor-http/ktor-http-cio/"]
requires = ["http"]

# ktor-events (`io.ktor.events.*`): the event bus behind `HttpClient.monitor`
# and the server's monitor. Depends on ktor-utils.
[features.events]
sources = ["upstream/ktor-shared/ktor-events/"]
requires = ["utils"]

# ktor-sse (`io.ktor.sse.*`): the ServerSentEvent model the client SSE
# session types are declared against. Depends on ktor-utils.
[features.sse]
sources = ["upstream/ktor-shared/ktor-sse/"]
requires = ["utils"]

# ktor-websockets (`io.ktor.websocket.*`): the frame model, the raw and
# default sessions, ping/pong and extensions. Depends on ktor-http.
[features.websockets]
sources = [
    "upstream/ktor-shared/ktor-websockets/",
    "klioMain/io/ktor/websocket/",
]
requires = ["http"]

# ktor-serialization (`io.ktor.serialization.*`): the ContentConverter
# contract both content-negotiation plugins program against, and the
# WebSocket converter. Depends on ktor-websockets.
[features.serialization]
sources = ["upstream/ktor-shared/ktor-serialization/common/"]
requires = ["websockets"]

# ktor-websocket-serialization (`io.ktor.websocket.serialization.*`): typed
# frames over a session's converter. Depends on ktor-serialization.
[features.websocket-serialization]
sources = ["upstream/ktor-shared/ktor-websocket-serialization/"]
requires = ["serialization"]

# ktor-serialization-kotlinx (`io.ktor.serialization.kotlinx.*`): the
# kotlinx.serialization-backed converter and the serializer lookup. Built
# on the kotlinx.serialization pack's core.
[features.serialization-kotlinx]
sources = [
    "upstream/ktor-shared/ktor-serialization/ktor-serialization-kotlinx/common/",
    "upstream/ktor-shared/ktor-serialization/ktor-serialization-kotlinx/posix/",
]
requires = ["serialization"]
deps = ["kotlinx.serialization"]

# ktor-serialization-kotlinx-json (`io.ktor.serialization.kotlinx.json.*`):
# `json()` for ContentNegotiation and the streaming converter over the
# kotlinx.serialization json + json-io modules.
[features.serialization-kotlinx-json]
sources = ["upstream/ktor-shared/ktor-serialization/ktor-serialization-kotlinx/ktor-serialization-kotlinx-json/"]
requires = ["serialization-kotlinx"]
deps = ["kotlinx.serialization/json-io"]

# ktor-test-dispatcher (`io.ktor.test.dispatcher.*`): the real-time /
# `testSuspend` runners over kotlinx-coroutines-test. Depends on ktor-utils.
[features.test-dispatcher]
sources = ["upstream/ktor-test-dispatcher/"]
requires = ["utils"]
deps = ["kotlinx.coroutines/test"]

# ktor-test-base (`io.ktor.test.*`): the `runTest` wrapper and
# `runTestWithData` the library's own commonTest files use. Depends on
# ktor-test-dispatcher (and ktor-utils: TestDefaults reads PlatformUtils).
[features.test-base]
sources = ["upstream/ktor-shared/ktor-test-base/"]
requires = ["test-dispatcher"]

# ktor-network (`io.ktor.network.*`): TCP, UDP and Unix sockets over a
# poll-based selector, the upstream common layer over klio's host socket
# natives. Upstream depends on ktor-utils (and ktor-io through it).
[features.network]
sources = [
    "upstream/ktor-network/",
    "klioMain/io/ktor/network/",
]
requires = ["utils"]

# ktor-network-tls (`io.ktor.network.tls.*`): TLS over a connected socket.
# Depends on ktor-network.
[features.network-tls]
sources = [
    "upstream/ktor-network/ktor-network-tls/",
    "klioMain/io/ktor/network/tls/",
]
requires = ["network"]

# ktor-client-core (`io.ktor.client.*`): the real upstream client (the engine
# layer + request/statement/call layers + default plugins + `HttpClient`),
# consumed verbatim. Upstream depends
# on ktor-http, ktor-events, ktor-sse, and (through ktor-websocket-serialization)
# ktor-serialization.
[features.client-core]
sources = [
    "upstream/ktor-client/ktor-client-core/",
    "klioMain/io/ktor/client/",
]
requires = ["http", "http-cio", "events", "sse", "websocket-serialization"]

# ktor-client-cio (`io.ktor.client.engine.cio.*`): the CIO engine, HTTP/1.1
# over ktor-network with keep-alive, streaming bodies and WebSocket upgrade;
# the default engine of `HttpClient()`.
[features.client-cio]
sources = [
    "upstream/ktor-client/ktor-client-cio/",
    "klioMain/io/ktor/client/engine/klio/",
]
requires = ["client-core", "network-tls"]

# ktor-server-cio (`io.ktor.server.cio.*`): the CIO engine,
# `embeddedServer(CIO)`, and klio's `Klio` engine name over it.
[features.server-cio]
sources = [
    "upstream/ktor-server/ktor-server-cio/",
    "klioMain/io/ktor/server/engine/klio/",
]
requires = ["server-core", "network", "network-tls", "http-cio"]

# ktor-client-mock (`io.ktor.client.engine.mock.*`): `MockEngine`.
[features.client-mock]
sources = ["upstream/ktor-client/ktor-client-mock/"]
requires = ["client-core"]

# ktor-server-test-host (`io.ktor.server.testing.*`): `testApplication` over
# the in-process test engine, with a client wired to it.
[features.server-test-host]
sources = ["upstream/ktor-server/ktor-server-test-host/"]
requires = ["client-cio", "server-core", "test-dispatcher"]

# ktor-server-test-base (`io.ktor.server.test.base.*`): the engine test base.
[features.server-test-base]
sources = ["upstream/ktor-server/ktor-server-test-base/"]
requires = ["server-test-host", "test-base"]

# ktor-server-core (`io.ktor.server.*`): `embeddedServer` + routing + the
# request/response pipeline over klio's engine actual on the native
# `__kktor_serve` loop. Upstream depends on ktor-utils, ktor-http,
# ktor-serialization, ktor-events, and ktor-websockets.
[features.server-core]
sources = [
    "upstream/ktor-server/ktor-server-core/",
    "klioMain/io/ktor/server/",
]
requires = ["http", "http-cio", "events", "serialization", "websockets"]

# ktor-client-content-negotiation
# (`io.ktor.client.plugins.contentnegotiation.*`): `ContentNegotiation`
# for the client; pair it with `serialization-kotlinx-json` for `json()`.
[features.client-content-negotiation]
sources = ["upstream/ktor-client/ktor-client-plugins/ktor-client-content-negotiation/"]
requires = ["client-core", "serialization"]

# ktor-server-content-negotiation
# (`io.ktor.server.plugins.contentnegotiation.*`): typed `receive` /
# `respond` for the server; pair it with `serialization-kotlinx-json`.
[features.server-content-negotiation]
sources = ["upstream/ktor-server/ktor-server-plugins/ktor-server-content-negotiation/"]
requires = ["server-core"]

# ktor-server-test-suites (`io.ktor.server.testing.suites.*`): the shared
# engine test suites, written with kotlin.test's assertions.
[features.server-test-suites]
sources = ["upstream/ktor-server/ktor-server-test-suites/"]
requires = [
    "server-test-base",
    "server-forwarded-header",
    "server-auto-head-response",
    "server-status-pages",
    "server-hsts",
    "server-websockets",
    "server-sse",
]
deps = ["kotlin.test"]

# ktor's test server (`test.server.*`): `io.ktor.testserver.runTestServer()`
# serves what the client suites call, as upstream's Gradle build does before
# their runs.
[features.test-server]
sources = ["upstream/ktor-test-server/", "klioMain/test/server/", "klioMain/io/ktor/testserver/"]
requires = [
    "server-cio",
    "server-auth",
    "server-caching-headers",
    "server-compression",
    "server-conditional-headers",
    "server-default-headers",
    "server-status-pages",
    "server-sse",
    "server-websockets",
    "client-core",
    "serialization-kotlinx-json",
]

# ktor-client-test-base (`io.ktor.client.test.base.*`): the client test
# helpers.
[features.client-test-base]
sources = ["upstream/ktor-client/ktor-client-test-base/"]
requires = ["client-core", "test-base"]


# Default auto-binding prefix is `io.ktor.`, covering both the client
# (`io.ktor.client.engine.*`) and server (`io.ktor.server.engine.*`)
# native engine helpers.

[[deps]]
id = "stdlib"

# Pipeline runtime deps: coroutines (`PipelineContext : CoroutineScope`,
# suspend `proceed`) and atomicfu (`Pipeline`'s `by atomic(...)`).
[[deps]]
id = "kotlinx.coroutines"

[[deps]]
id = "kotlinx.atomicfu"

# `io.ktor.utils.io` channel types (`ByteReadChannel`/`ByteWriteChannel`) and
# the `OutgoingContent` body layer are backed by kotlinx.io `Buffer`/`Source`.
[[deps]]
id = "kotlinx.io"

# Features mirror ktor's Gradle module structure: one feature per ktor
# module, all opt-in via `--feature io.ktor/<name>`. Nothing loads by
# default; a higher-level feature pulls the modules it needs through
# `requires` (matching upstream's inter-module deps), so e.g.
# `--feature io.ktor/client` activates http -> utils -> io and events.
[features]
default = []

# ktor-io (`io.ktor.utils.io.*`): the channel layer (the fully-buffered
# read side + the async `ByteChannel` Slot state machine and write side),
# locks, and charsets. klio supplies the `locks` / `ioDispatcher` /
# terminal-codec actuals under `shim/core`.
[features.io]
sources = [
    "upstream/ktor-io/common/src/",
    "upstream/ktor-io/posix/src/",
    "shim/core/io/ktor/utils/io/",
]

# ktor-utils (`io.ktor.util.*`): string/collection helpers,
# CaseInsensitiveMap, Attributes, GMTDate, the pipeline runtime, and
# logging. klio supplies the platform / concurrent-map / date / logger
# actuals under `shim/core`. Depends on ktor-io.
[features.utils]
sources = [
    "upstream/ktor-utils/common/src/",
    "upstream/ktor-utils/posix/src/",
    "shim/core/io/ktor/util/",
]
requires = ["io"]

# ktor-http (`io.ktor.http.*`): status codes, methods, headers, content
# types, URLs, and the `OutgoingContent` body layer. Depends on
# ktor-utils (and ktor-io through it).
[features.http]
sources = [
    "upstream/ktor-http/common/src/",
    "upstream/ktor-http/posix/src/",
]
requires = ["utils"]

# ktor-events (`io.ktor.events.*`): the event bus behind `HttpClient.monitor`
# and the server's monitor. Depends on ktor-utils.
[features.events]
sources = [
    "upstream/ktor-shared/ktor-events/common/src/",
]
requires = ["utils"]

# ktor-test-base / ktor-test-dispatcher (`io.ktor.test.*`): the shared
# test runners. Depends on ktor-utils (TestDefaults reads PlatformUtils).
[features.test-base]
sources = [
    "upstream/ktor-shared/ktor-test-base/common/src/",
    "upstream/ktor-shared/ktor-test-base/jvmAndPosix/src/",
    "upstream/ktor-test-dispatcher/common/src/",
    "upstream/ktor-test-dispatcher/posix/src/",
]
requires = ["utils"]

# ktor-client-core: the real upstream client (the engine layer +
# request/statement/call layers + default plugins + `HttpClient`), consumed
# verbatim. klio supplies the platform pieces under `shim/client-upstream`:
# the `KlioClientEngine` actual over the host `__kktor_request` transport
# and the engine-less `HttpClient()` actual bound to it. The nonJvm engine
# loader (the `engines` registry) is consumed and usable, but klio's actual
# binds `KlioClient` directly. Depends on ktor-http and ktor-events.
[features.client]
sources = [
    "upstream/ktor-client/ktor-client-core/",
    "shim/client-upstream/",
]
requires = ["http", "events"]

# ktor-server-core: `embeddedServer` + routing + `respondText` over the
# native `__kktor_serve` loop. Depends on ktor-http and ktor-events.
[features.server]
sources = [
    "upstream/ktor-server/ktor-server-core/common/src/io/ktor/server/",
    "upstream/ktor-server/ktor-server-core/posix/src/io/ktor/server/",
    "upstream/ktor-server/ktor-server-core/nonJvm/src/io/ktor/server/",
    "shim/server-engine/",
]
requires = ["http", "events"]

# ktor-client-content-negotiation + ktor-serialization-kotlinx-json:
# `install(ContentNegotiation) { json() }` backed by kotlinx-serialization,
# so the upstream `body<T>()` / `setBody(value)` round-trip typed JSON.
# Pulls the serialization pack's `json` feature (its core alone has no Json).
[features.client-serialization]
sources = [
    "upstream/ktor-client/ktor-client-plugins/ktor-client-content-negotiation/",
    "upstream/ktor-shared/ktor-serialization/",
]
deps = ["kotlinx.serialization/json"]
requires = ["client"]

# ktor-server-content-negotiation + ktor-serialization-kotlinx-json:
# typed `respond<T>()` / `receive<T>()` and `ContentNegotiation { json() }`.
[features.server-serialization]
sources = [
    "upstream/ktor-server/ktor-server-plugins/ktor-server-content-negotiation/",
    "upstream/ktor-shared/ktor-serialization/",
]
deps = ["kotlinx.serialization/json"]
requires = ["server"]

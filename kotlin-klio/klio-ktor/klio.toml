# Upstream ktor-client-core commonMain, the whole module: the engine layer,
# the request, statement and call layers, the default and optional plugins
# (timeout, retry, redirect, cookies, cache, default request, user agent,
# websockets, SSE) and HttpClient itself. Gated under the client-core feature.
[[source]]
root = "upstream/ktor-client/ktor-client-core/common/src"

# ktor-server-core: the application, the engine base, routing, the request
# and response pipelines, config and plugins API, verbatim. klio replaces,
# under klioMain/io/ktor/server, the posix files that reach the platform
# through cinterop: the environment and `getenv` bridges
# (EnvironmentUtilsNix, EnvironmentUtils.nix), the signal shutdown hook
# (ShutdownHookNative), the processor count and stderr writer
# (ApplicationUtilsNix) and the hostname escape (EngineUtilsNix). It also
# replaces the native receive transformation, which refuses multipart, with
# the JVM's multipart parsing over ktor-http-cio (DefaultTransformNix).
[[source]]
root = "upstream/ktor-server/ktor-server-core/common/src"

[[source]]
root = "upstream/ktor-server/ktor-server-core/posix/src"

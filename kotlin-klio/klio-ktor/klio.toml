[library]
# Umbrella id for the whole ktor surface this pack ships
# (`io.ktor.client.*`, `io.ktor.server.*`, `io.ktor.http.*`,
# `io.ktor.serialization.*`). A pack is selected when a user import
# prefix-matches its id, so the umbrella lets a server-only program
# (which never imports `io.ktor.client.*`) still load the pack.
id = "io.ktor"
version = "3.5.2"
abi = 1
implicit_packages = []
auto_bindings = true

# ktor-io: the byte channels, the packet and pool layer, charsets and locks.
# Common, nonJvm and jvmAndPosix run verbatim. klio replaces, under
# klioMain/io/ktor/utils/io: `ByteChannel.kt` (a copy with the close-cause
# rethrow in `awaitContent`), the lock, IO-dispatcher, byte-order and
# `PosixException` actuals, and the charset codec terminals, which upstream
# binds to iconv through cinterop. The posix operations over native pointers
# (`CPointer` reads and writes) have no klio counterpart.
[[source]]
root = "upstream/ktor-io/common/src"
exclude = [
    "io/ktor/utils/io/ByteChannel.kt",
]

[[source]]
root = "upstream/ktor-io/posix/src"
exclude = [
    "io/ktor/utils/io/ByteReadChannelOperations.posix.kt",
    "io/ktor/utils/io/ByteWriteChannelOperations.posix.kt",
    "io/ktor/utils/io/IODispatcher.posix.kt",
    "io/ktor/utils/io/Input.posix.kt",
    "io/ktor/utils/io/locks/Synchronized.kt",
    "io/ktor/utils/io/core/ByteOrderNative.kt",
    "io/ktor/utils/io/core/BytePacketBuilderOperations.posix.kt",
    "io/ktor/utils/io/errors/PosixErrors.kt",
]

[[source]]
root = "upstream/ktor-io/nonJvm/src"

[[source]]
root = "upstream/ktor-io/jvmAndPosix/src"

# ktor-utils: text and collection helpers, Attributes, the pipeline runtime,
# dates, crypto, logging and encoders. Common runs verbatim. klio replaces,
# under klioMain/io/ktor/util, the posix files that reach the platform
# through cinterop: the nonce source and `Digest` (CryptoNative), the GMTDate
# clock (DateNative), `KtorSimpleLogger` (its `getenv`), `DISABLE_SFG`
# (PipelineContext.posix) and the signal-based `ThreadInfo`.
[[source]]
root = "upstream/ktor-utils/common/src"

[[source]]
root = "upstream/ktor-utils/posix/src"
exclude = [
    "io/ktor/util/CryptoNative.kt",
    "io/ktor/util/ThreadInfo.kt",
    "io/ktor/util/date/DateNative.kt",
    "io/ktor/util/logging/KtorSimpleLoggerNative.kt",
    "io/ktor/util/pipeline/PipelineContext.posix.kt",
]

# ktor-http: URLs, headers, content types, cookies, the body content model,
# the header grammar and the auth header model, verbatim.
[[source]]
root = "upstream/ktor-http/common/src"

# ktor-http-cio: the CIO message parser and multipart reader the client's
# default response transform reads multipart bodies with. Pure Kotlin on
# every platform; gated under the `http-cio` feature.
[[source]]
root = "upstream/ktor-http/ktor-http-cio/common/src"

[[source]]
root = "upstream/ktor-http/ktor-http-cio/jvmAndPosix/src"

[[source]]
root = "upstream/ktor-http/ktor-http-cio/posix/src"

# ktor-client-core nonJvm: the `engines` registry the default engine is found
# through, the timeout exceptions, the engine-dispatcher switch,
# `unwrapCancellationException` and the static platform config.
[[source]]
root = "upstream/ktor-client/ktor-client-core/nonJvm/src"

# ktor-client-core posix: the `ProxyConfig` actual, the default-transform
# actuals, the response observer's context and the posix coroutine utils.
# The engine-less `HttpClient()` is a klio actual (klioMain): upstream's
# reads the `engines` list that `@EagerInitialization` hooks fill, which klio
# does not run.
[[source]]
root = "upstream/ktor-client/ktor-client-core/posix/src"
exclude = [
    "io/ktor/client/HttpClient.kt",
]

# ktor-client-core jvmAndPosix: `checkContentLength` and the Unix-socket
# request builders.
[[source]]
root = "upstream/ktor-client/ktor-client-core/jvmAndPosix/src"

# ktor-sse: the server-sent event model both SSE plugins are built on.
[[source]]
root = "upstream/ktor-shared/ktor-sse/common/src"

# ktor-websockets: the frame model, the raw and default sessions, ping/pong
# and extensions. Common and posix are plain Kotlin.
[[source]]
root = "upstream/ktor-shared/ktor-websockets/common/src"
[[source]]
root = "upstream/ktor-shared/ktor-websockets/posix/src"

# ktor-websocket-serialization: typed `sendSerialized`/`receiveDeserialized`
# over a session's converter.
[[source]]
root = "upstream/ktor-shared/ktor-websocket-serialization/common/src"

# ktor-serialization (the ContentConverter contract and the WebSocket
# converter) + the kotlinx and kotlinx-json converters, vendored unchanged.
# Gated under the `serialization*` features.
[[source]]
root = "upstream/ktor-shared/ktor-serialization/common/src"
[[source]]
root = "upstream/ktor-shared/ktor-serialization/ktor-serialization-kotlinx/common/src"
[[source]]
root = "upstream/ktor-shared/ktor-serialization/ktor-serialization-kotlinx/posix/src"
[[source]]
root = "upstream/ktor-shared/ktor-serialization/ktor-serialization-kotlinx/ktor-serialization-kotlinx-json/common/src"
[[source]]
root = "upstream/ktor-shared/ktor-serialization/ktor-serialization-kotlinx/ktor-serialization-kotlinx-json/posix/src"
[[source]]
root = "upstream/ktor-client/ktor-client-plugins/ktor-client-content-negotiation/common/src"
[[source]]
root = "upstream/ktor-client/ktor-client-plugins/ktor-client-content-negotiation/posix/src"
[[source]]
root = "upstream/ktor-server/ktor-server-plugins/ktor-server-content-negotiation/common/src"
[[source]]
root = "upstream/ktor-server/ktor-server-plugins/ktor-server-content-negotiation/posix/src"

# ktor-events: the event bus behind `HttpClient.monitor` and the server's
# monitor. Gated under `events`.
[[source]]
root = "upstream/ktor-shared/ktor-events/common/src"

# ktor-http posix: `URLBuilder.Companion.origin`.
[[source]]
root = "upstream/ktor-http/posix/src"

# ktor-test-base + ktor-test-dispatcher (`io.ktor.test.*`,
# `io.ktor.test.dispatcher.*`): the `runTest` wrapper over
# kotlinx-coroutines-test, `runTestWithData`, and the real-time /
# `testSuspend` runners the library's own commonTest files use. The
# jvmAndPosix / posix roots carry the `actual`s (DummyTestResult,
# `andThen`, `testSuspend`).
[[source]]
root = "upstream/ktor-shared/ktor-test-base/common/src"

[[source]]
root = "upstream/ktor-shared/ktor-test-base/jvmAndPosix/src"

[[source]]
root = "upstream/ktor-test-dispatcher/common/src"

[[source]]
root = "upstream/ktor-test-dispatcher/posix/src"

# Upstream ktor-client-core commonMain, the whole module: the engine layer,
# the request, statement and call layers, the default and optional plugins
# (timeout, retry, redirect, cookies, cache, default request, user agent,
# websockets, SSE) and HttpClient itself. Gated under the client-core feature.
[[source]]
root = "upstream/ktor-client/ktor-client-core/common/src"

# ktor-server-core: the application, the engine base, routing, the request
# and response pipelines, config and plugins API, verbatim. klio replaces,
# under klioMain/io/ktor/server, the posix files that reach the platform
# through cinterop: the environment and `getenv` bridges
# (EnvironmentUtilsNix, EnvironmentUtils.nix), the signal shutdown hook
# (ShutdownHookNative), the processor count and stderr writer
# (ApplicationUtilsNix) and the hostname escape (EngineUtilsNix).
[[source]]
root = "upstream/ktor-server/ktor-server-core/common/src"

[[source]]
root = "upstream/ktor-server/ktor-server-core/posix/src"
exclude = [
    "io/ktor/server/engine/EnvironmentUtilsNix.kt",
    "io/ktor/server/engine/ShutdownHookNative.kt",
    "io/ktor/server/engine/internal/ApplicationUtilsNix.kt",
    "io/ktor/server/engine/internal/EngineUtilsNix.kt",
]

[[source]]
root = "upstream/ktor-server/ktor-server-core/nonJvm/src"

# ktor-network: TCP, UDP and Unix sockets and the selector. The common and
# nonJvm sets run verbatim, as do the posix files that are plain Kotlin (the
# selector manager and its event records, the socket base, the address and
# builder glue). The posix and nix files that reach the platform through
# cinterop (socket calls, `sockaddr`, pselect, the wakeup pipe) are klio
# copies under klioMain/io/ktor/network over the host socket natives.
[[source]]
root = "upstream/ktor-network/common/src"

[[source]]
root = "upstream/ktor-network/nonJvm/src"

[[source]]
root = "upstream/ktor-network/posix/src"
include = [
    "io/ktor/network/selector/SelectorManager.kt",
    "io/ktor/network/selector/WorkerSelectorManager.kt",
    "io/ktor/network/selector/SelectUtils.kt",
    "io/ktor/network/selector/EventInfo.kt",
    "io/ktor/network/selector/SelectableNative.kt",
    "io/ktor/network/sockets/NativeSocketImpl.kt",
    "io/ktor/network/sockets/TCPSocketBuilderNative.kt",
    "io/ktor/network/sockets/SocketAddress.nonJvm.posix.kt",
    "io/ktor/network/util/NativeUtils.kt",
    "io/ktor/network/util/Pools.kt",
]

[[source]]
root = "upstream/ktor-network/nix/src"
include = [
    "io/ktor/network/sockets/SocketAddress.nonJvm.nix.kt",
]

# ktor-network-tls: the TLS configuration, cipher-suite and extension model
# and the `Socket.tls()` entry points.
[[source]]
root = "upstream/ktor-network/ktor-network-tls/common/src"

[[source]]
root = "upstream/ktor-network/ktor-network-tls/nonJvm/src"

# ktor-client-cio: the coroutine-based HTTP/1.1 client engine over
# ktor-network, verbatim. Its posix `Loader.posix.kt` registers the engine
# through `@EagerInitialization`, which klio does not run; the klio default
# engine actual binds CIO instead.
[[source]]
root = "upstream/ktor-client/ktor-client-cio/common/src"

[[source]]
root = "upstream/ktor-client/ktor-client-cio/nonJvm/src"

# ktor-server-cio: the coroutine-based HTTP/1.1 server engine over
# ktor-network, verbatim, with its posix dispatcher bridge.
[[source]]
root = "upstream/ktor-server/ktor-server-cio/common/src"

[[source]]
root = "upstream/ktor-server/ktor-server-cio/nonJvm/src"

[[source]]
root = "upstream/ktor-server/ktor-server-cio/posix/src"

# ktor-client-mock: `MockEngine`, the in-memory client engine tests answer
# requests with.
[[source]]
root = "upstream/ktor-client/ktor-client-mock/common/src"

# ktor-server-test-host: `testApplication`, the in-process server engine and
# its client, with the posix bridges.
[[source]]
root = "upstream/ktor-server/ktor-server-test-host/common/src"

[[source]]
root = "upstream/ktor-server/ktor-server-test-host/posix/src"

# ktor-server-test-base: the engine test base the server modules' commonTest
# suites extend.
[[source]]
root = "upstream/ktor-server/ktor-server-test-base/common/src"

[[source]]
root = "upstream/ktor-server/ktor-server-test-base/nonJvm/src"

[[source]]
root = "upstream/ktor-server/ktor-server-test-base/posix/src"

# klio-authored actuals for every module, placed in their module by package
# path: `io/ktor/utils/io` (ktor-io: locks, the terminal codecs, the
# IO dispatcher, the ByteChannel actual), `io/ktor/util` (ktor-utils: crypto,
# GMTDate, the logger, the pipeline engine), `io/ktor/client` (ktor-client-core:
# the KlioClientEngine over the host `__kktor_request` transport and the
# engine-less `HttpClient()`), `io/ktor/server` (ktor-server-core: the engine
# over `__kktor_serve`, environment / shutdown / application-utils and
# hostname-escape actuals).
[[source]]
root = "klioMain"

# Default auto-binding prefix is `io.ktor.`, covering both the client
# (`io.ktor.client.engine.*`) and server (`io.ktor.server.engine.*`)
# native engine helpers.

[deps]
stdlib = "*"
# Pipeline runtime deps: coroutines (`PipelineContext : CoroutineScope`,
# suspend `proceed`) and atomicfu (`Pipeline`'s `by atomic(...)`).
"kotlinx.coroutines" = "*"
"kotlinx.atomicfu" = "*"
# `io.ktor.utils.io` channel types (`ByteReadChannel`/`ByteWriteChannel`) and
# the `OutgoingContent` body layer are backed by kotlinx.io `Buffer`/`Source`.
"kotlinx.io" = "*"

# Features mirror ktor's Gradle module structure: one feature per ktor
# module, named after the artifact with `ktor-` stripped, all opt-in via
# `--feature io.ktor/<name>`. Nothing loads by default. `requires` carries
# each module's upstream `api` dependencies inside ktor, so enabling
# `client-core` activates http -> utils -> io, events, sse, and serialization
# -> websockets: the closure the Gradle artifact resolves. `deps` names the
# features of other packs a module is built on.
[features]
default = []

# ktor-io (`io.ktor.utils.io.*`): the channel layer (the fully-buffered
# read side + the async `ByteChannel` Slot state machine and write side),
# locks, and charsets. klio supplies the `locks` / `ioDispatcher` /
# terminal-codec actuals.
[features.io]
sources = [
    "upstream/ktor-io/",
    "klioMain/io/ktor/utils/io/",
]

# ktor-utils (`io.ktor.util.*`): string/collection helpers,
# CaseInsensitiveMap, Attributes, GMTDate, the pipeline runtime, and
# logging. klio supplies the platform / concurrent-map / date / logger
# actuals. Depends on ktor-io.
[features.utils]
sources = [
    "upstream/ktor-utils/",
    "klioMain/io/ktor/util/",
]
requires = ["io"]

# ktor-http (`io.ktor.http.*`): status codes, methods, headers, content
# types, URLs, and the `OutgoingContent` body layer. Depends on
# ktor-utils (and ktor-io through it).
[features.http]
sources = ["upstream/ktor-http/"]
requires = ["utils"]

# ktor-http-cio (`io.ktor.http.cio.*`): the CIO HTTP message parser and the
# multipart reader. Depends on ktor-http.
[features.http-cio]
sources = ["upstream/ktor-http/ktor-http-cio/"]
requires = ["http"]

# ktor-events (`io.ktor.events.*`): the event bus behind `HttpClient.monitor`
# and the server's monitor. Depends on ktor-utils.
[features.events]
sources = ["upstream/ktor-shared/ktor-events/"]
requires = ["utils"]

# ktor-sse (`io.ktor.sse.*`): the ServerSentEvent model the client SSE
# session types are declared against. Depends on ktor-utils.
[features.sse]
sources = ["upstream/ktor-shared/ktor-sse/"]
requires = ["utils"]

# ktor-websockets (`io.ktor.websocket.*`): the frame model, the raw and
# default sessions, ping/pong and extensions. Depends on ktor-http.
[features.websockets]
sources = ["upstream/ktor-shared/ktor-websockets/"]
requires = ["http"]

# ktor-serialization (`io.ktor.serialization.*`): the ContentConverter
# contract both content-negotiation plugins program against, and the
# WebSocket converter. Depends on ktor-websockets.
[features.serialization]
sources = ["upstream/ktor-shared/ktor-serialization/common/"]
requires = ["websockets"]

# ktor-websocket-serialization (`io.ktor.websocket.serialization.*`): typed
# frames over a session's converter. Depends on ktor-serialization.
[features.websocket-serialization]
sources = ["upstream/ktor-shared/ktor-websocket-serialization/"]
requires = ["serialization"]

# ktor-serialization-kotlinx (`io.ktor.serialization.kotlinx.*`): the
# kotlinx.serialization-backed converter and the serializer lookup. Built
# on the kotlinx.serialization pack's core.
[features.serialization-kotlinx]
sources = [
    "upstream/ktor-shared/ktor-serialization/ktor-serialization-kotlinx/common/",
    "upstream/ktor-shared/ktor-serialization/ktor-serialization-kotlinx/posix/",
]
requires = ["serialization"]
deps = ["kotlinx.serialization"]

# ktor-serialization-kotlinx-json (`io.ktor.serialization.kotlinx.json.*`):
# `json()` for ContentNegotiation and the streaming converter over the
# kotlinx.serialization json + json-io modules.
[features.serialization-kotlinx-json]
sources = ["upstream/ktor-shared/ktor-serialization/ktor-serialization-kotlinx/ktor-serialization-kotlinx-json/"]
requires = ["serialization-kotlinx"]
deps = ["kotlinx.serialization/json-io"]

# ktor-test-dispatcher (`io.ktor.test.dispatcher.*`): the real-time /
# `testSuspend` runners over kotlinx-coroutines-test. Depends on ktor-utils.
[features.test-dispatcher]
sources = ["upstream/ktor-test-dispatcher/"]
requires = ["utils"]
deps = ["kotlinx.coroutines/test"]

# ktor-test-base (`io.ktor.test.*`): the `runTest` wrapper and
# `runTestWithData` the library's own commonTest files use. Depends on
# ktor-test-dispatcher (and ktor-utils: TestDefaults reads PlatformUtils).
[features.test-base]
sources = ["upstream/ktor-shared/ktor-test-base/"]
requires = ["test-dispatcher"]

# ktor-network (`io.ktor.network.*`): TCP, UDP and Unix sockets over a
# poll-based selector, the upstream common layer over klio's host socket
# natives. Upstream depends on ktor-utils (and ktor-io through it).
[features.network]
sources = [
    "upstream/ktor-network/",
    "klioMain/io/ktor/network/",
]
requires = ["utils"]

# ktor-network-tls (`io.ktor.network.tls.*`): TLS over a connected socket.
# Depends on ktor-network.
[features.network-tls]
sources = ["upstream/ktor-network/ktor-network-tls/"]
requires = ["network"]

# ktor-client-core (`io.ktor.client.*`): the real upstream client (the engine
# layer + request/statement/call layers + default plugins + `HttpClient`),
# consumed verbatim, plus klio's engine actual over the host `__kktor_request`
# transport and the engine-less `HttpClient()` bound to it. Upstream depends
# on ktor-http, ktor-events, ktor-sse, and (through ktor-websocket-serialization)
# ktor-serialization.
[features.client-core]
sources = [
    "upstream/ktor-client/ktor-client-core/",
    "klioMain/io/ktor/client/",
]
requires = ["http", "http-cio", "events", "sse", "websocket-serialization"]

# ktor-client-cio (`io.ktor.client.engine.cio.*`): the CIO engine, HTTP/1.1
# over ktor-network with keep-alive, streaming bodies and WebSocket upgrade;
# the default engine of `HttpClient()`.
[features.client-cio]
sources = [
    "upstream/ktor-client/ktor-client-cio/",
    "klioMain/io/ktor/client/engine/cio/",
    "klioMain/io/ktor/client/engine/klio/",
]
requires = ["client-core", "network-tls"]

# ktor-server-cio (`io.ktor.server.cio.*`): the CIO engine,
# `embeddedServer(CIO)`, and klio's `Klio` engine name over it.
[features.server-cio]
sources = [
    "upstream/ktor-server/ktor-server-cio/",
    "klioMain/io/ktor/server/engine/klio/",
]
requires = ["server-core", "network", "http-cio"]

# ktor-client-mock (`io.ktor.client.engine.mock.*`): `MockEngine`.
[features.client-mock]
sources = ["upstream/ktor-client/ktor-client-mock/"]
requires = ["client-core"]

# ktor-server-test-host (`io.ktor.server.testing.*`): `testApplication` over
# the in-process test engine, with a client wired to it.
[features.server-test-host]
sources = ["upstream/ktor-server/ktor-server-test-host/"]
requires = ["client-cio", "server-core", "test-dispatcher"]

# ktor-server-test-base (`io.ktor.server.test.base.*`): the engine test base.
[features.server-test-base]
sources = ["upstream/ktor-server/ktor-server-test-base/"]
requires = ["server-test-host", "test-base"]

# ktor-server-core (`io.ktor.server.*`): `embeddedServer` + routing + the
# request/response pipeline over klio's engine actual on the native
# `__kktor_serve` loop. Upstream depends on ktor-utils, ktor-http,
# ktor-serialization, ktor-events, and ktor-websockets.
[features.server-core]
sources = [
    "upstream/ktor-server/ktor-server-core/",
    "klioMain/io/ktor/server/",
]
requires = ["http", "events", "serialization", "websockets"]

# ktor-client-content-negotiation
# (`io.ktor.client.plugins.contentnegotiation.*`): `ContentNegotiation`
# for the client; pair it with `serialization-kotlinx-json` for `json()`.
[features.client-content-negotiation]
sources = ["upstream/ktor-client/ktor-client-plugins/ktor-client-content-negotiation/"]
requires = ["client-core", "serialization"]

# ktor-server-content-negotiation
# (`io.ktor.server.plugins.contentnegotiation.*`): typed `receive` /
# `respond` for the server; pair it with `serialization-kotlinx-json`.
[features.server-content-negotiation]
sources = ["upstream/ktor-server/ktor-server-plugins/ktor-server-content-negotiation/"]
requires = ["server-core"]

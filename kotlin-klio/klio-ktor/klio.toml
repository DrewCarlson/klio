[library]
# Umbrella id for the whole ktor surface this pack ships
# (`io.ktor.client.*`, `io.ktor.server.*`, `io.ktor.http.*`,
# `io.ktor.serialization.*`). A pack is selected when a user import
# prefix-matches its id, so the umbrella lets a server-only program
# (which never imports `io.ktor.client.*`) still load the pack.
id = "io.ktor"
version = "3.5.1"
abi = 1
implicit_packages = []
source_roots = ["shim"]
auto_bindings = true

# Real upstream ktor-http value types consumed verbatim from the
# submodule (the start of the upstream-consumption migration; see
# plans/KTOR-UPSTREAM.md). Gated under the `io` feature.
# Real upstream `io.ktor.utils.io` annotations (`InternalAPI`, `KtorDsl`,
# `ExperimentalKtorApi`, …) consumed verbatim — pure declarations the rest
# of ktor's commonMain imports. Gated under the `io` feature.
[[source]]
root = "upstream/ktor-io/common/src"
include = [
    "io/ktor/utils/io/Annotations.kt",
    "io/ktor/utils/io/Deprecation.kt",
    "io/ktor/utils/io/core/Input.kt",
    "io/ktor/utils/io/core/Buffer.kt",
    "io/ktor/utils/io/core/Strings.kt",
    "io/ktor/utils/io/core/ByteReadPacket.kt",
    "io/ktor/utils/io/core/BytePacketBuilder.kt",
    "io/ktor/utils/io/core/Builder.kt",
    # Channel layer: the read side (the fully-buffered, non-suspending
    # `SourceByteReadChannel`, the `ByteReadChannel(bytes/text/source)`
    # factories, the read operations — the shape a response body is drained
    # with) and the async write side (the `ByteChannel` Slot state machine +
    # the write operations). klio supplies the `locks` actuals under
    # `shim/core`; `DEVELOPMENT_MODE` comes from the posix set below.
    "io/ktor/utils/io/ByteReadChannel.kt",
    "io/ktor/utils/io/ByteWriteChannel.kt",
    "io/ktor/utils/io/BufferedByteWriteChannel.kt",
    "io/ktor/utils/io/Exceptions.kt",
    "io/ktor/utils/io/CloseToken.kt",
    "io/ktor/utils/io/SourceByteReadChannel.kt",
    "io/ktor/utils/io/ByteChannelCtor.kt",
    "io/ktor/utils/io/ByteReadChannelOperations.kt",
    "io/ktor/utils/io/ByteWriteChannelOperations.kt",
    "io/ktor/utils/io/LineEndingMode.kt",
    "io/ktor/utils/io/LineEnding.kt",
    "io/ktor/utils/io/SinkByteWriteChannel.kt",
    "io/ktor/utils/io/ByteChannelScanner.kt",
    "io/ktor/utils/io/ByteChannelUtils.kt",
    "io/ktor/utils/io/CountedByteReadChannel.kt",
    "io/ktor/utils/io/CountedByteWriteChannel.kt",
    "io/ktor/utils/io/CloseHookByteWriteChannel.kt",
    "io/ktor/utils/io/locks/Synchronized.kt",
    # Engine I/O dispatcher expect (the engine base's default dispatcher).
    # klio supplies the `Unconfined` actual under `shim/core`.
    "io/ktor/utils/io/IODispatcher.kt",
    # Charsets: the expect surface + the encode/decode extension layer.
    # The class actuals come from the posix set below; klio supplies only
    # the terminal UTF-8/ISO-8859-1 codec actuals under `shim/core`.
    "io/ktor/utils/io/charsets/Encoding.kt",
    "io/ktor/utils/io/core/internal/CharArraySequence.kt",
]

# ktor-io posix actuals that are pure Kotlin (`DEVELOPMENT_MODE`, the
# Charset/CharsetEncoder/CharsetDecoder class layer). The cinterop-bound
# ones (locks, the iconv codec terminals, `ioDispatcher`) stay klio-side
# actuals under `shim/core`.
[[source]]
root = "upstream/ktor-io/posix/src"
include = [
    "io/ktor/utils/io/ByteChannel.posix.kt",
    "io/ktor/utils/io/charsets/CharsetNative.kt",
]


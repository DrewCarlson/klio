[library]
id = "kotlinx.atomicfu"
version = "0.33.0"
abi = 1
implicit_packages = []
auto_bindings = true

# Upstream kotlinx-atomicfu 0.33.0 commonMain, consumed straight from
# the in-pack git submodule. `include` curates exactly the `expect`
# API surface klio can parse + resolve; intrinsic-only files
# (JS-mangling actuals, native locks) are excluded and re-declared in
# klioMain where klio needs them.
[[source]]
root = "upstream/atomicfu/src/commonMain/kotlin"
include = [
    "kotlinx/atomicfu/AtomicFU.common.kt",
    "kotlinx/atomicfu/Trace.common.kt",
    "kotlinx/atomicfu/TraceFormat.kt",
    "kotlinx/atomicfu/MangledJsNames.kt",
    "kotlinx/atomicfu/OptionalJsName.kt",
]

# klio-supplied platform actuals for every consumed upstream `expect`.
# Bodies are thin Kotlin; the Rust host bindings in src/lib.rs win at
# dispatch for the atomic ops.
[[source]]
root = "klioMain"

[[deps]]
id = "stdlib"

# klio.bundle: a program's resources. `klio bundle --include` embeds files
# into the executable's resource table, and `klio run --include` (or the
# manifest's [application] include) serves the same files from disk; a
# program reads them through `klio.bundle.Resources`. The object methods
# delegate to the interpreter's `__klio_bundle_*` host intrinsics
# (auto-bound below). With no includes, `readBytes`/`readText` throw
# IllegalStateException, `list()` is empty, and `exists()` is false.
[library]
id = "klio.bundle"
version = "0.1.0"
abi = 1
implicit_packages = []
auto_bindings = true

[[source]]
root = "klioMain"

[deps]
stdlib = "*"


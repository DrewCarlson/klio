# androidx.compose.ui.text — text model + styling (AnnotatedString, TextStyle,
# SpanStyle/ParagraphStyle, FontFamily/FontWeight, TextLayoutResult), vendored
# verbatim. A dependency of compose.foundation. Text SHAPING/measure/draw
# (Paragraph, ParagraphIntrinsics, drawMultiParagraph) are klioMain actuals over the Skia
# Paragraph shim; landing incrementally, so those defer to runtime for now.
[library]
id = "androidx.compose.ui.text"
version = "1.12.0"
abi = 1
implicit_packages = []
auto_bindings = true

[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-text/src/commonMain/kotlin"

# nonJvmMain: the atomics, the gap buffer and the annotated string helpers.
[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-text/src/nonJvmMain/kotlin"

# skikoMain: paragraphs over org.jetbrains.skia.paragraph, fonts through
# skiko's font collection, and the platform text surface.
[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-text/src/skikoMain/kotlin"

# nativeMain: the weak-key cache, typeface loading through FontMgr, and no
# font synthesis, as the native target has them.
[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-text/src/nativeMain/kotlin"

# klioMain: the locale and the string casing (the native target's are
# darwinMain's, over Foundation), and the font resolve interceptor.
[[source]]
root = "klioMain"

[deps]
stdlib = "*"
"androidx.annotation" = "*"
"androidx.compose.runtime" = "*"
"androidx.compose.runtime.saveable" = "*"
"androidx.compose.ui.util" = "*"
"androidx.compose.ui.geometry" = "*"
"androidx.compose.ui.unit" = "*"
"androidx.compose.ui.graphics" = "*"
"androidx.collection" = "*"
"kotlinx.atomicfu" = "*"
"kotlinx.coroutines" = "*"
"org.jetbrains.skiko" = "*"


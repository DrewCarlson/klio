# androidx.compose.ui.text — text model + styling (AnnotatedString, TextStyle,
# SpanStyle/ParagraphStyle, FontFamily/FontWeight, TextLayoutResult), vendored
# verbatim. A dependency of compose.foundation. Text SHAPING/measure/draw
# (ActualParagraph, drawMultiParagraph) are klioMain actuals over the Skia
# Paragraph shim; landing incrementally, so those defer to runtime for now.
[library]
id = "androidx.compose.ui.text"
version = "1.11.1"
abi = 1
implicit_packages = []
auto_bindings = true

[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-text/src/commonMain/kotlin"

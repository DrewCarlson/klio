# androidx.compose.ui:ui-graphics — the compose UI graphics module as a skiko
# target has it: commonMain (colors and color spaces, Path with its iterator,
# geometry, hit tester and SVG conversion, brushes, the drawing scope), and
# skikoMain's Canvas, Paint, Path, PathMeasure, shaders, filters, images and
# GraphicsLayer over org.jetbrains.skia.
[library]
id = "androidx.compose.ui.graphics"
version = "1.12.0"
abi = 1
implicit_packages = []
auto_bindings = true

[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-graphics/src/commonMain/kotlin"

# nonJvmMain: the JVM-default marker.
[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-graphics/src/nonJvmMain/kotlin"

# skikoMain: everything over org.jetbrains.skia and skiko's RenderNode.
[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-graphics/src/skikoMain/kotlin"

# skikoExcludingWebMain: an Image's Bitmap drawn through a Canvas.
[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-graphics/src/skikoExcludingWebMain/kotlin"

# klioMain: the host's surfaces (a window's frame, icons, offscreen PNGs) drawn
# through a skiko Canvas, and the native target's byte copy.
[[source]]
root = "klioMain"

[deps]
stdlib = "*"
"androidx.annotation" = "*"
"androidx.compose.runtime" = "*"
"androidx.compose.ui.util" = "*"
"androidx.compose.ui.geometry" = "*"
"androidx.compose.ui.unit" = "*"
# Connector.kt uses androidx.collection.mutableIntObjectMapOf for its
# colorspace-connection cache.
"androidx.collection" = "*"
"org.jetbrains.skiko" = "*"


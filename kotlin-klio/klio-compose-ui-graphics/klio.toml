# androidx.compose.ui:ui-graphics — the compose UI graphics module: its whole
# commonMain vendored verbatim (colors and color spaces, Path with its
# iterator, geometry, hit tester and SVG conversion, brushes, the drawing
# scope, GraphicsLayer's surface), over klioMain's platform actuals.
[library]
id = "androidx.compose.ui.graphics"
version = "1.12.0"
abi = 1
implicit_packages = []
auto_bindings = true

[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-graphics/src/commonMain/kotlin"

# nonJvmMain: the JVM-default marker.
[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-graphics/src/nonJvmMain/kotlin"

# klioMain: the platform actuals (Path command buffer and measure, Paint, Canvas
# over the Skia shim, ImageBitmap, RenderEffect, GraphicsLayer) and the
# GraphicsContext that creates the layers.
[[source]]
root = "klioMain"

[deps]
stdlib = "*"
"androidx.annotation" = "*"
"androidx.compose.runtime" = "*"
"androidx.compose.ui.util" = "*"
"androidx.compose.ui.geometry" = "*"
"androidx.compose.ui.unit" = "*"
# Connector.kt uses androidx.collection.mutableIntObjectMapOf for its
# colorspace-connection cache.
"androidx.collection" = "*"


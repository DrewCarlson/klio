# androidx.compose.ui — the real Compose UI foundation math layer, vendored
# verbatim from the compose-multiplatform-core submodule (shared with the compose
# runtime pack). This is genuine androidx.compose.ui code: the geometry
# (Offset/Size/Rect/RoundRect), unit (Dp/IntOffset/IntSize/Constraints), util
# (packFloats/lerp), and graphics (the Color inline value class + the color-science
# colorspace package) packages — pure Kotlin over inline value classes, no Skia. The
# klioMain layer supplies the handful of platform `expect` actuals (float-bit
# helpers, fastRoundToInt, no-op tracing) plus androidx.annotation marker stubs. The
# heavier ui-unit files that pull in Density/FontScaling/TextUnit are excluded for this
# first cut.
[library]
id = "androidx.compose.ui"
version = "1.11.1"
abi = 1
implicit_packages = []
auto_bindings = true

# ui-util: the math + inline-class helpers geometry/unit build on.
[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-util/src/commonMain/kotlin"
include = [
    "androidx/compose/ui/util/MathHelpers.kt",
    "androidx/compose/ui/util/ListUtils.kt",
    "androidx/compose/ui/util/InlineClassHelper.kt",
]

# ui-geometry: Offset / Size / Rect / RoundRect / CornerRadius (all pure).
[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-geometry/src/commonMain/kotlin"
include = [
    "androidx/compose/ui/geometry/GeometryUtils.kt",
    "androidx/compose/ui/geometry/InlineClassHelper.kt",
    "androidx/compose/ui/geometry/Offset.kt",
    "androidx/compose/ui/geometry/Size.kt",
    "androidx/compose/ui/geometry/CornerRadius.kt",
    "androidx/compose/ui/geometry/Rect.kt",
    "androidx/compose/ui/geometry/RoundRect.kt",
    "androidx/compose/ui/geometry/MutableRect.kt",
]

# ui-unit: the self-contained units (Dp/IntOffset/IntSize/IntRect/Constraints/…).
[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-unit/src/commonMain/kotlin"
include = [
    "androidx/compose/ui/unit/ComposeUiUnitFlags.kt",
    "androidx/compose/ui/unit/InlineClassHelper.kt",
    "androidx/compose/ui/unit/LayoutDirection.kt",
    "androidx/compose/ui/unit/Dp.kt",
    "androidx/compose/ui/unit/IntOffset.kt",
    "androidx/compose/ui/unit/IntSize.kt",
    "androidx/compose/ui/unit/IntRect.kt",
    "androidx/compose/ui/unit/Constraints.kt",
    "androidx/compose/ui/unit/Velocity.kt",
]

# ui-graphics: the real Color inline value class + the full colorspace package
# (pure color-science math over Float/Long bit-packing — no Skia). Color.kt and
# each colorspace file are consumed verbatim from upstream. Their
# `androidx.annotation.*` range/size markers and `androidx.collection`
# int-object map are supplied by the klioMain stubs and the collection pack dep.
[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-graphics/src/commonMain/kotlin"
include = [
    "androidx/compose/ui/graphics/Color.kt",
    "androidx/compose/ui/graphics/Float16.kt",
    "androidx/compose/ui/graphics/InlineClassHelper.kt",
    "androidx/compose/ui/graphics/colorspace/Adaptation.kt",
    "androidx/compose/ui/graphics/colorspace/ColorModel.kt",
    "androidx/compose/ui/graphics/colorspace/ColorSpace.kt",
    "androidx/compose/ui/graphics/colorspace/ColorSpaces.kt",
    "androidx/compose/ui/graphics/colorspace/Connector.kt",
    "androidx/compose/ui/graphics/colorspace/Illuminant.kt",
    "androidx/compose/ui/graphics/colorspace/Lab.kt",
    "androidx/compose/ui/graphics/colorspace/Oklab.kt",
    "androidx/compose/ui/graphics/colorspace/RenderIntent.kt",
    "androidx/compose/ui/graphics/colorspace/Rgb.kt",
    "androidx/compose/ui/graphics/colorspace/TransferParameters.kt",
    "androidx/compose/ui/graphics/colorspace/WhitePoint.kt",
    "androidx/compose/ui/graphics/colorspace/Xyz.kt",
]

# klioMain: the platform `expect` actuals (float bits, fastRoundToInt, tracing)
# plus the androidx.annotation range/size marker stubs the vendored graphics
# sources import.
[[source]]
root = "klioMain"

[[deps]]
id = "stdlib"
[[deps]]
id = "androidx.compose.runtime"
# Connector.kt uses androidx.collection.mutableIntObjectMapOf for its
# colorspace-connection cache.
[[deps]]
id = "androidx.collection"

# androidx.compose.ui:ui-graphics — the compose UI graphics module, vendored
# verbatim. One klio pack per upstream Gradle module: the
# `androidx.compose.ui.graphics` package. This first cut is the pure,
# non-Skia surface — the Color inline value class, the color-science colorspace
# package (Rgb / ColorSpaces / the XYZ transforms), and the drawing-parameter
# value classes (BlendMode / StrokeCap / PathFillType / …). The Skia-backed
# Canvas / Paint / Path / DrawScope layer is vendored on top of the native shim
# separately.
#
# The klioMain layer supplies the androidx.annotation range/size marker stubs the
# vendored graphics sources import.
[library]
id = "androidx.compose.ui.graphics"
version = "1.11.1"
abi = 1
implicit_packages = []
auto_bindings = true

[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-graphics/src/commonMain/kotlin"
include = [
    "androidx/compose/ui/graphics/Color.kt",
    "androidx/compose/ui/graphics/Float16.kt",
    "androidx/compose/ui/graphics/InlineClassHelper.kt",
    # The pure-Kotlin Path surface (klioMain supplies the actual command buffer).
    "androidx/compose/ui/graphics/internal/JvmDefaultWithCompatibility.kt",
    "androidx/compose/ui/graphics/Path.kt",
    "androidx/compose/ui/graphics/PathIterator.kt",
    "androidx/compose/ui/graphics/PathSegment.kt",
    "androidx/compose/ui/graphics/Matrix.kt",
    # The Paint surface (klioMain supplies the actual value object) + the value
    # types its properties reference (Shader / ColorFilter / PathEffect / etc.).
    "androidx/compose/ui/graphics/Paint.kt",
    "androidx/compose/ui/graphics/Shader.kt",
    "androidx/compose/ui/graphics/ColorFilter.kt",
    "androidx/compose/ui/graphics/ColorMatrix.kt",
    "androidx/compose/ui/graphics/PathEffect.kt",
    "androidx/compose/ui/graphics/ImageBitmap.kt",
    "androidx/compose/ui/graphics/PixelMap.kt",
    # Pure drawing-parameter value classes (inline over Int; Immutable only).
    "androidx/compose/ui/graphics/BlendMode.kt",
    "androidx/compose/ui/graphics/ClipOp.kt",
    "androidx/compose/ui/graphics/FilterQuality.kt",
    "androidx/compose/ui/graphics/PaintingStyle.kt",
    "androidx/compose/ui/graphics/PathFillType.kt",
    "androidx/compose/ui/graphics/PathOperation.kt",
    "androidx/compose/ui/graphics/PointMode.kt",
    "androidx/compose/ui/graphics/StrokeCap.kt",
    "androidx/compose/ui/graphics/StrokeJoin.kt",
    "androidx/compose/ui/graphics/TileMode.kt",
    "androidx/compose/ui/graphics/VertexMode.kt",
    # colorspace: the Color inline value class's color-science backing.
    "androidx/compose/ui/graphics/colorspace/Adaptation.kt",
    "androidx/compose/ui/graphics/colorspace/ColorModel.kt",
    "androidx/compose/ui/graphics/colorspace/ColorSpace.kt",
    "androidx/compose/ui/graphics/colorspace/ColorSpaces.kt",
    "androidx/compose/ui/graphics/colorspace/Connector.kt",
    "androidx/compose/ui/graphics/colorspace/Illuminant.kt",
    "androidx/compose/ui/graphics/colorspace/Lab.kt",
    "androidx/compose/ui/graphics/colorspace/Oklab.kt",
    "androidx/compose/ui/graphics/colorspace/RenderIntent.kt",
    "androidx/compose/ui/graphics/colorspace/Rgb.kt",
    "androidx/compose/ui/graphics/colorspace/TransferParameters.kt",
    "androidx/compose/ui/graphics/colorspace/WhitePoint.kt",
    "androidx/compose/ui/graphics/colorspace/Xyz.kt",
]

# klioMain: the androidx.annotation range/size marker stubs.
[[source]]
root = "klioMain"

[[deps]]
id = "stdlib"
[[deps]]
id = "androidx.compose.runtime"
[[deps]]
id = "androidx.compose.ui.util"
# Connector.kt uses androidx.collection.mutableIntObjectMapOf for its
# colorspace-connection cache.
[[deps]]
id = "androidx.collection"

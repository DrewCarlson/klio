# androidx.compose.runtime.saveable: the Saver abstraction, rememberSaveable,
# rememberSerializable, the SaveableStateRegistry and SaveableStateHolder, and
# the bridge to a SavedStateRegistryOwner, vendored verbatim (commonMain,
# whole) over the lifecycle and savedstate libraries.
[library]
id = "androidx.compose.runtime.saveable"
version = "1.12.0"
abi = 1
implicit_packages = []
auto_bindings = true

[[source]]
root = "../klio-compose-runtime/upstream/compose/runtime/runtime-saveable/src/commonMain/kotlin"

[deps]
stdlib = "*"
"androidx.compose.runtime" = "*"
"androidx.collection" = "*"
# SaveableStateRegistryWrapper keeps a LifecycleRegistry and bridges to
# LocalSavedStateRegistryOwner; rememberSerializable encodes through the
# saved-state codec.
"androidx.lifecycle" = "*"
"androidx.savedstate" = { version = "*", features = ["compose"] }
"kotlinx.serialization" = "*"

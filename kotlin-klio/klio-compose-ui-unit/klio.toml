# androidx.compose.ui:ui-unit — the compose UI unit module, vendored verbatim.
# One klio pack per upstream Gradle module: the `androidx.compose.ui.unit` package
# (Dp / IntOffset / IntSize / IntRect / Constraints / Velocity / TextUnit / Density /
# LayoutDirection) — the density-independent units and pixel<->dp<->sp conversions
# the layout system runs on. Pure Kotlin over inline value classes, no Skia.
# The non-Android and non-JVM actuals come from upstream too: FontScaling is
# the linear Sp<->Dp conversion.
[library]
id = "androidx.compose.ui.unit"
version = "1.12.0"
abi = 1
implicit_packages = []
auto_bindings = true

[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-unit/src/commonMain/kotlin"

# nonAndroidMain: FontScaling is FontScalingLinear, and the insets in dp;
# nonJvmMain: the JVM-default marker.
[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-unit/src/nonAndroidMain/kotlin"

[[source]]
root = "../klio-compose-runtime/upstream/compose/ui/ui-unit/src/nonJvmMain/kotlin"

[deps]
stdlib = "*"
"androidx.compose.runtime" = "*"
"androidx.compose.ui.util" = "*"
"androidx.compose.ui.geometry" = "*"


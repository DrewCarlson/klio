# androidx.compose.foundation.layout — the Compose layout primitives (Box, Row,
# Column, Arrangement, Padding, Size, Spacer, flow/grid layouts, window insets),
# vendored verbatim. Depends on the ui engine, unit, graphics, and runtime packs.
[library]
id = "androidx.compose.foundation.layout"
version = "1.12.0"
abi = 1
implicit_packages = []
auto_bindings = true

[[source]]
root = "../klio-compose-runtime/upstream/compose/foundation/foundation-layout/src/commonMain/kotlin"

# nonJvmMain: the JVM-default marker.
[[source]]
root = "../klio-compose-runtime/upstream/compose/foundation/foundation-layout/src/nonJvmMain/kotlin"

# skikoMain: the window insets actuals, read from the scene's platform insets
# (none on a desktop window).
[[source]]
root = "../klio-compose-runtime/upstream/compose/foundation/foundation-layout/src/skikoMain/kotlin"
include = [
    "androidx/compose/foundation/layout/WindowInsets.skiko.kt",
    "androidx/compose/foundation/layout/WindowInsetsPadding.skiko.kt",
]

[deps]
stdlib = "*"
"androidx.annotation" = "*"
"androidx.compose.runtime" = "*"
"androidx.compose.ui" = "*"
"androidx.compose.ui.unit" = "*"
"androidx.compose.ui.geometry" = "*"
"androidx.compose.ui.graphics" = "*"
"androidx.compose.ui.util" = "*"
"androidx.collection" = "*"


name: Publish Docs

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: publish-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  file-changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.docs.outputs.any_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Detect docs changes
        id: docs
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5
        with:
          files: |
            .github/workflows/publish-docs.yml
            docs/**
            mkdocs.yml

  publish-docs:
    runs-on: ubuntu-latest
    needs: [file-changes]
    # Every tag publishes; an untagged main push publishes only when the docs changed.
    if: needs.file-changes.outputs.docs == 'true' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Configure Git user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
          architecture: x64
          cache: 'pip'
          cache-dependency-path: 'docs/requirements.txt'
      - name: Install docs dependencies
        run: python3 -m pip install -r ./docs/requirements.txt
      # A tag vX.Y.Z publishes under X.Y.Z and moves the `latest` alias.
      - name: Deploy tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF_NAME#v} mike deploy --update-aliases --push ${{ github.ref_name }} latest
      # An untagged main push publishes under <VERSION>-MAIN and moves the `main` alias.
      - name: Deploy main
        if: startsWith(github.ref, 'refs/tags/v') == false
        run: |
          BASE=$(sed -nE 's/^[[:space:]]*\.version = "([^"]+)".*/\1/p' build.zig.zon | head -1)
          VERSION="${BASE}-MAIN" mike deploy --update-aliases --push "${BASE}-MAIN" main

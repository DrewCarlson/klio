name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded push to the same ref cancels the older run instead of
# queueing a full battery behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fast signal: the module unit tests (seconds of run time).
          - name: unit tests
            step: test
            shard: unit
          # The integration suite fans across weight-balanced shards
          # (see -Ditest-shard in build.zig; weights are CI-runner-scaled).
          # Each shard restores its own banked cache and runs ~an eighth of
          # the suite. Weights are measured ReleaseSafe-harness seconds on
          # 4 cores (÷10); the 60-minute budget absorbs the cold compile of
          # the harness universe and a slow runner.
          - name: itest shard 0
            step: itest -Ditest-shard=0/8
            shard: itest0
          - name: itest shard 1
            step: itest -Ditest-shard=1/8
            shard: itest1
          - name: itest shard 2
            step: itest -Ditest-shard=2/8
            shard: itest2
          - name: itest shard 3
            step: itest -Ditest-shard=3/8
            shard: itest3
          - name: itest shard 4
            step: itest -Ditest-shard=4/8
            shard: itest4
          - name: itest shard 5
            step: itest -Ditest-shard=5/8
            shard: itest5
          - name: itest shard 6
            step: itest -Ditest-shard=6/8
            shard: itest6
          - name: itest shard 7
            step: itest -Ditest-shard=7/8
            shard: itest7
    steps:
      # Submodules are populated explicitly below, NOT by actions/checkout's
      # recursive fetch. The vendored `update = none` trees (kotlin, compose,
      # androidx-collection, mosaic) are sparse, script-populated checkouts that
      # do not exist at clone time; letting the checkout action fetch submodules
      # recursively makes git exit 128 on those empty gitlinks. A plain
      # `git submodule update --init --recursive` fetches the regular kotlinx +
      # ktor trees and cleanly skips the `update = none` ones (no 128).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: fetch vendored submodules (kotlinx + ktor)
        run: git submodule update --init --recursive

      - name: install zig 0.16.0
        run: |
          set -euo pipefail
          curl -sSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar -xJ
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      # The interpreter reads upstream Kotlin stdlib sources from kotlin/ at
      # runtime (the stdlib pack is built from them). The `kotlin` submodule is
      # populated as a sparse, blobless clone of libraries/stdlib at the pinned
      # tag; the cache key tracks the submodule pin recorded in .gitmodules.
      - name: cache kotlin stdlib sources (kotlin/)
        id: kotlin-src-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: kotlin
          key: kotlin-src-${{ hashFiles('.gitmodules') }}-libraries-stdlib

      - name: populate kotlin submodule (if not cached)
        if: steps.kotlin-src-cache.outputs.cache-hit != 'true'
        run: ./scripts/init-kotlin-submodule.sh

      # The compose runtime + androidx.collection packs read their upstream
      # sources (and the compose conformance suite reads its commonTest files)
      # from these `update = none` submodules, populated as treeless, sparse,
      # shallow checkouts of the pinned compose-multiplatform-core tag. Without
      # them compose_plugin_commontest and androidx_collection_commontest find
      # no sources and fall below their baselines.
      - name: cache compose + androidx-collection + mosaic upstream sources
        id: compose-src-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            kotlin-klio/klio-compose-runtime/upstream
            kotlin-klio/klio-androidx-collection/upstream
            kotlin-klio/klio-mosaic/upstream
          key: compose-src-${{ hashFiles('.gitmodules') }}-v1.11.1-mosaic

      - name: populate compose + androidx-collection + mosaic submodules (if not cached)
        if: steps.compose-src-cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/init-compose-submodule.sh
          ./scripts/init-androidx-collection-submodule.sh
          ./scripts/init-mosaic-submodule.sh

      # Both zig caches: the global cache (package fetches like the vendored
      # zstd tarball, compiled artifacts) and the project-local .zig-cache
      # (build artifacts plus the test run-step result manifests, so unchanged
      # test steps are cache hits in CI exactly as they are locally). Keyed
      # per-commit-and-shard with prefix restore so every run starts from the
      # nearest prior cache; the shard suffix keeps concurrent saves from
      # racing on one key. Restore and save are split so the save runs even
      # when the job fails or times out -- a partial compile still banks
      # progress for the next run instead of restarting cold forever.
      - name: restore zig build + test state
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-0.16.0-safe-${{ hashFiles('build.zig.zon') }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            zig-0.16.0-safe-${{ hashFiles('build.zig.zon') }}-${{ matrix.shard }}-
            zig-0.16.0-safe-${{ hashFiles('build.zig.zon') }}-

      # The zig caches only ever grow (zig has no cache GC): a restored cache
      # near the runner's free-disk budget leaves no room for this shard's
      # build products and the job dies with ENOSPC. Past the budget, start
      # fresh — the per-shard save then banks a compact cache for later runs.
      - name: prune oversized zig caches
        run: |
          set -euo pipefail
          for d in .zig-cache "$HOME/.cache/zig"; do
            [ -d "$d" ] || continue
            kb=$(du -sk "$d" | cut -f1)
            if [ "$kb" -gt 5242880 ]; then
              echo "pruning $d (${kb} KB exceeds the 5 GB budget)"
              rm -rf "$d"
            fi
          done
          df -h / | tail -1

      # -Dharness-optimize=ReleaseSafe, the same harness the local battery
      # runs: the interpreting suites are compute-bound (stdlib, coroutines,
      # androidx, datetime, the json census, the in-process e2e/differential
      # corpora) and the Debug interpreter runs them ~4x slower, which on a
      # 4-vCPU runner turned every heavy suite into a ratchet miss or a
      # shard timeout. The optimizing compile of the harness universe costs
      # ~5 minutes cold per shard, far less than it saves.
      - name: zig build ${{ matrix.step }}
        run: zig build ${{ matrix.step }} -Dharness-optimize=ReleaseSafe --summary all

      - name: save zig build + test state
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-0.16.0-safe-${{ hashFiles('build.zig.zon') }}-${{ matrix.shard }}-${{ github.sha }}

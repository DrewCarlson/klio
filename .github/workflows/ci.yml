name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded push to the same ref cancels the older run instead of
# queueing a full battery behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fast signal: the module unit tests (seconds of run time).
          - name: unit tests
            step: test
            shard: unit
          # The integration suite fans across weight-balanced shards
          # (see -Ditest-shard in build.zig). All shards compile from the
          # same restored cache; each runs ~a third of the suite.
          - name: itest shard 0
            step: itest -Ditest-shard=0/3
            shard: itest0
          - name: itest shard 1
            step: itest -Ditest-shard=1/3
            shard: itest1
          - name: itest shard 2
            step: itest -Ditest-shard=2/3
            shard: itest2
    steps:
      # The kotlin-klio/*/upstream vendor trees (kotlinx + ktor sources the
      # interpreter consumes at runtime) are submodules; without them every
      # pack-using test fails with unresolved kotlinx/ktor globals. The
      # `kotlin` submodule is `update = none` (the full repo is ~5GB), so the
      # recursive checkout skips it; it is populated sparsely below.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: install zig 0.16.0
        run: |
          set -euo pipefail
          curl -sSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar -xJ
          echo "$PWD/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      # The interpreter reads upstream Kotlin stdlib sources from kotlin/ at
      # runtime (the stdlib pack is built from them). The `kotlin` submodule is
      # populated as a sparse, blobless clone of libraries/stdlib at the pinned
      # tag; the cache key tracks the submodule pin recorded in .gitmodules.
      - name: cache kotlin stdlib sources (kotlin/)
        id: kotlin-src-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: kotlin
          key: kotlin-src-${{ hashFiles('.gitmodules') }}-libraries-stdlib

      - name: populate kotlin submodule (if not cached)
        if: steps.kotlin-src-cache.outputs.cache-hit != 'true'
        run: ./scripts/init-kotlin-submodule.sh

      # Both zig caches: the global cache (package fetches like the vendored
      # zstd tarball, compiled artifacts) and the project-local .zig-cache
      # (build artifacts plus the test run-step result manifests, so unchanged
      # test steps are cache hits in CI exactly as they are locally). Keyed
      # per-commit-and-shard with prefix restore so every run starts from the
      # nearest prior cache; the shard suffix keeps concurrent saves from
      # racing on one key. Restore and save are split so the save runs even
      # when the job fails or times out -- a partial compile still banks
      # progress for the next run instead of restarting cold forever.
      - name: restore zig build + test state
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-0.16.0-debug-${{ hashFiles('build.zig.zon') }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            zig-0.16.0-debug-${{ hashFiles('build.zig.zon') }}-${{ matrix.shard }}-
            zig-0.16.0-debug-${{ hashFiles('build.zig.zon') }}-

      # -Dharness-optimize=Debug: locally the program-running harness binaries
      # compile a second ReleaseSafe module universe so interpreted test
      # programs run ~5x faster across thousands of iterations. CI runs each
      # step once, so the slower Debug interpreter costs minutes while the
      # second universe's optimizing compiles cost tens of minutes on a
      # 4-vCPU runner. One universe here; the ReleaseSafe configuration runs
      # in the harness-release workflow (manual / weekly).
      - name: zig build ${{ matrix.step }}
        run: zig build ${{ matrix.step }} -Dharness-optimize=Debug --summary all

      - name: save zig build + test state
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-0.16.0-debug-${{ hashFiles('build.zig.zon') }}-${{ matrix.shard }}-${{ github.sha }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded push to the same ref cancels the older run instead of
# queueing a full battery behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast signal (~2 minutes), and the gate for everything below it: a broken
  # build used to burn eight 30-minute shards before anyone saw the two-minute
  # failure that explained them.
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/klio-env
        with:
          cache-key: unit
      - name: zig build test
        run: zig build test -Dharness-optimize=ReleaseSafe --summary all
      - name: save zig build + test state
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-0.16.0-safe-${{ hashFiles('build.zig.zon') }}-unit-${{ github.sha }}

  # The integration suite fans across weight-balanced shards (see -Ditest-shard
  # in build.zig; weights are CI-runner-scaled). Each shard restores and banks
  # its own cache lineage — the shard suffix keeps concurrent saves off one key.
  itest:
    name: ${{ matrix.name }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: itest shard 0
            step: itest -Ditest-shard=0/8
            shard: itest0
          - name: itest shard 1
            step: itest -Ditest-shard=1/8
            shard: itest1
          - name: itest shard 2
            step: itest -Ditest-shard=2/8
            shard: itest2
          - name: itest shard 3
            step: itest -Ditest-shard=3/8
            shard: itest3
          - name: itest shard 4
            step: itest -Ditest-shard=4/8
            shard: itest4
          - name: itest shard 5
            step: itest -Ditest-shard=5/8
            shard: itest5
          - name: itest shard 6
            step: itest -Ditest-shard=6/8
            shard: itest6
          - name: itest shard 7
            step: itest -Ditest-shard=7/8
            shard: itest7
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/klio-env
        with:
          cache-key: ${{ matrix.shard }}
      - name: zig build ${{ matrix.step }}
        run: zig build ${{ matrix.step }} -Dharness-optimize=ReleaseSafe --summary all
      - name: save zig build + test state
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-0.16.0-safe-${{ hashFiles('build.zig.zon') }}-${{ matrix.shard }}-${{ github.sha }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cache kotlin-native (~/.konan)
        id: konan-cache
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-2.3.21
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: install kotlin-native (if not cached)
        if: steps.konan-cache.outputs.cache-hit != 'true'
        run: cargo run -q -p ktc-parity --bin ktc-parity -- --install

      - name: cargo test
        run: cargo test --workspace

      - name: stdlib coverage non-regression gate
        run: |
          set -euo pipefail
          output=$(cargo run -q -p ktc-stdlib-gen -- coverage)
          echo "$output"
          current=$(printf '%s\n' "$output" | grep -oE 'implemented [0-9]+' | awk '{print $2}')
          if [ -z "${current:-}" ]; then
            echo "failed to parse implemented count from coverage output" >&2
            exit 1
          fi
          baseline=$(tr -d '[:space:]' < coverage-baseline.txt)
          echo "current=$current baseline=$baseline"
          if [ "$current" -lt "$baseline" ]; then
            echo "stdlib coverage regressed: $current < $baseline (see coverage-baseline.txt)" >&2
            exit 1
          fi

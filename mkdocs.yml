site_name: Klio
site_description: An experimental Kotlin interpreter written in Zig.
site_url: https://klio.dev/
repo_url: https://drewcarlson.github.io/klio/
remote_branch: gh-pages
docs_dir: docs
edit_uri: edit/main/docs/
copyright: 'Copyright &copy; 2026 Klio Contributors'

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

plugins:
  - search
  - markdownextradata: {}

extra:
  version:
    provider: mike
  klio_version: !ENV [VERSION, '0.1.0']
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DrewCarlson/klio

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Hello, world: getting-started/hello-world.md
    - CLI Tour: getting-started/cli.md
    - Testing Your Code: testing.md
    - Bundling Programs: BUNDLE.md
  - Architecture:
    - Pipeline Overview: architecture/pipeline.md
    - The Vm: architecture/interpreter.md
    - Standard Library: architecture/stdlib.md
    - Concurrency: architecture/concurrency.md
    - Memory Model: architecture/memory-model.md
    - Diagnostics: architecture/diagnostics.md
    - Performance: architecture/performance.md
  - Packs:
    - What is a Pack?: packs/overview.md
    - Pack Format: packs/format.md
    - Using Packs: packs/using.md
    - Authoring a Pack: packs/authoring.md
    - Native Bindings: packs/native-bindings.md
    - Shipped Packs:
      - kotlinx.atomicfu: packs/shipped/atomicfu.md
      - kotlinx.io: packs/shipped/io.md
      - kotlinx.datetime: packs/shipped/datetime.md
      - kotlinx.coroutines: packs/shipped/coroutines.md
      - kotlinx.serialization: packs/shipped/serialization.md
      - io.ktor: packs/shipped/ktor.md
      - androidx.compose.runtime: packs/shipped/compose-runtime.md
  - Development:
    - Workspace Layout: development/workspace.md
    - Testing: development/testing.md
    - Debugging: development/debugging.md
    - Contributing: development/contributing.md

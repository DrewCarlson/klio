[package]
name = "klio-interp-ir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Phase-F bake-off: forward the tracing-GC `ObjRef` backing. Off by
# default; the production build is the unchanged Arc backing.
gc = ["klio-runtime/gc"]

[lints]
workspace = true

[dependencies]
klio-ir          = { workspace = true }
klio-runtime     = { workspace = true }
klio-ast         = { workspace = true }
klio-span        = { workspace = true }
klio-stdlib      = { workspace = true }
klio-diagnostics = { workspace = true }
thiserror        = "2"

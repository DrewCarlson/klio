[package]
name = "klio-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Off by default: the production backing stays `Arc<AdaptiveCell>`,
# untouched. With `--features gc`, `ObjRef::new` additionally registers
# every cell in a global stop-the-world mark/sweep tracing heap whose
# sweep releases the heap's retaining handle for cells unreachable from
# the Vm's registered roots. The public `ObjRef` API and observable
# Kotlin semantics are identical under both backings; `gc` is the
# Phase-F bake-off comparison backing, retained behind the flag.
gc = []

[dependencies]
klio-span  = { workspace = true }
klio-ast   = { workspace = true }
thiserror = { workspace = true }
regex     = "1"
# Shared `AdaptiveCell`s use a reader/writer lock so parallel reads of
# a published Kotlin object run concurrently while writes stay
# exclusive; `read_recursive()` keeps same-thread nested shared
# borrows (e.g. reading a list while iterating it) deadlock-free.
parking_lot = { workspace = true }

# `loom` models AdaptiveCell's atomics/Mutex/UnsafeCell only when the
# build is invoked with `RUSTFLAGS="--cfg loom"`. The cfg gate means
# it is never resolved, downloaded, or linked into a normal build;
# `cargo build/test` without the flag is unaffected. It is a regular
# (not dev) dependency because the lib's `cell_sync` module itself
# references `loom::{sync,cell}` under `cfg(loom)`.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints]
workspace = true

[package]
name = "klio-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "klio"
path = "src/main.rs"

[features]
# Phase-F bake-off: forward the tracing-GC `ObjRef` backing so the
# `klio` binary can run the parallel-throughput comparison under the
# gc backing. Off by default; production is the unchanged Arc backing.
gc = ["klio-runtime/gc", "klio-interp-ir/gc"]

[dependencies]
klio-span        = { workspace = true }
klio-diagnostics = { workspace = true }
klio-lexer       = { workspace = true }
klio-parser      = { workspace = true }
klio-resolver    = { workspace = true }
klio-typeck      = { workspace = true }
klio-interp-ir   = { workspace = true }
klio-ast         = { workspace = true }
klio-pack        = { workspace = true }
klio-stdlib      = { workspace = true }
klio-stdlib-pack = { workspace = true }
klio-kotlinx-atomicfu = { workspace = true }
klio-kotlinx-io       = { workspace = true }
klio-kotlinx-datetime = { workspace = true }
klio-kotlinx-coroutines = { workspace = true }
klio-ktor-client = { workspace = true }
klio-runtime     = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
toml             = "0.9"
zstd             = "0.13"
klio-types       = { workspace = true }
walkdir          = "2"
clap            = { workspace = true }
rustyline       = { workspace = true }

[lints]
workspace = true

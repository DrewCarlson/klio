[library]
# Umbrella id for the whole ktor surface this pack ships
# (`io.ktor.client.*`, `io.ktor.server.*`, `io.ktor.http.*`,
# `io.ktor.serialization.*`). A pack is selected when a user import
# prefix-matches its id, so the umbrella lets a server-only program
# (which never imports `io.ktor.client.*`) still load the pack.
id = "io.ktor"
version = "3.2.0"
abi = 1
implicit_packages = []
source_roots = ["shim"]
auto_bindings = true

# Real upstream ktor-http value types consumed verbatim from the
# submodule (the start of the upstream-consumption migration; see
# plans/KTOR-UPSTREAM.md). These are ungated (core), always available.
# Real upstream `io.ktor.utils.io` annotations (`InternalAPI`, `KtorDsl`,
# `ExperimentalKtorApi`, …) consumed verbatim — pure declarations the rest
# of ktor's commonMain imports. Ungated (core).
[[source]]
root = "upstream/ktor-io/common/src"
include = [
    "io/ktor/utils/io/Annotations.kt",
    "io/ktor/utils/io/Deprecation.kt",
    "io/ktor/utils/io/core/Buffer.kt",
    "io/ktor/utils/io/core/ByteReadPacket.kt",
]

# Upstream `io.ktor.util` string helpers (escapeHTML / quote /
# toLowerCasePreservingASCIIRules / caseInsensitive …) — self-contained,
# foundational for the http header/value parsing layer. Ungated (core).
[[source]]
root = "upstream/ktor-utils/common/src"
include = [
    "io/ktor/util/Text.kt",
    "io/ktor/util/Collections.kt",
    "io/ktor/util/DelegatingMutableSet.kt",
    "io/ktor/util/CaseInsensitiveMap.kt",
    "io/ktor/util/StringValues.kt",
]

[[source]]
root = "upstream/ktor-http/common/src"
include = [
    "io/ktor/http/HttpStatusCode.kt",
    "io/ktor/http/HttpMethod.kt",
    "io/ktor/http/HttpProtocolVersion.kt",
    "io/ktor/http/HttpHeaders.kt",
    "io/ktor/http/HttpHeaderValueParser.kt",
    "io/ktor/http/HeaderValueWithParameters.kt",
    "io/ktor/http/ContentTypes.kt",
    "io/ktor/http/Headers.kt",
    "io/ktor/http/Parameters.kt",
    "io/ktor/http/CacheControl.kt",
    "io/ktor/http/ContentDisposition.kt",
    "io/ktor/http/ContentTypeMatcher.kt",
    "io/ktor/http/HttpMessage.kt",
    "io/ktor/http/LinkHeader.kt",
    "io/ktor/http/RequestConnectionPoint.kt",
    "io/ktor/http/Ranges.kt",
    "io/ktor/http/ContentRange.kt",
    "io/ktor/http/RangesSpecifier.kt",
    "io/ktor/http/Codecs.kt",
]
# Default auto-binding prefix is `io.ktor.`, covering both the client
# (`io.ktor.client.engine.*`) and server (`io.ktor.server.engine.*`)
# native engine helpers.

[[deps]]
id = "stdlib"

# Cargo-style features mirroring ktor's Gradle module structure. The
# core (io.ktor.http types under shim/core) is ungated and always loads;
# everything else is opt-in via `--feature io.ktor/<name>`. The
# *-serialization features pull the kotlinx.serialization pack only when
# enabled, so a plain client/server program needs no serializer.
[features]
default = []
# ktor-client-core: HttpClient + request/response builder DSL.
client = { sources = ["shim/client"] }
# ktor-server-core: embeddedServer + routing + respondText.
server = { sources = ["shim/server"] }
# ktor-client-content-negotiation + ktor-serialization-kotlinx-json:
# typed body<T>() / setBody<T>() and ContentNegotiation { json() }. Pulls
# the serialization pack's `json` feature (its core alone has no Json).
client-serialization = { sources = ["shim/client-serialization"], deps = ["kotlinx.serialization/json"], requires = ["client"] }
# ktor-server-content-negotiation + ktor-serialization-kotlinx-json:
# typed respond<T>() / receive<T>() and ContentNegotiation { json() }.
server-serialization = { sources = ["shim/server-serialization"], deps = ["kotlinx.serialization/json"], requires = ["server"] }

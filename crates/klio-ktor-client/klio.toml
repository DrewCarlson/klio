[library]
# Umbrella id for the whole ktor surface this pack ships
# (`io.ktor.client.*`, `io.ktor.server.*`, `io.ktor.http.*`,
# `io.ktor.serialization.*`). A pack is selected when a user import
# prefix-matches its id, so the umbrella lets a server-only program
# (which never imports `io.ktor.client.*`) still load the pack.
id = "io.ktor"
version = "3.2.0"
abi = 1
implicit_packages = []
source_roots = ["shim"]
auto_bindings = true
# Default auto-binding prefix is `io.ktor.`, covering both the client
# (`io.ktor.client.engine.*`) and server (`io.ktor.server.engine.*`)
# native engine helpers.

[[deps]]
id = "stdlib"

# Cargo-style features mirroring ktor's Gradle module structure. The
# core (io.ktor.http types under shim/core) is ungated and always loads;
# everything else is opt-in via `--feature io.ktor/<name>`. The
# *-serialization features pull the kotlinx.serialization pack only when
# enabled, so a plain client/server program needs no serializer.
[features]
default = []
# ktor-client-core: HttpClient + request/response builder DSL.
client = { sources = ["shim/client"] }
# ktor-server-core: embeddedServer + routing + respondText.
server = { sources = ["shim/server"] }
# ktor-client-content-negotiation + ktor-serialization-kotlinx-json:
# typed body<T>() / setBody<T>() and ContentNegotiation { json() }.
client-serialization = { sources = ["shim/client-serialization"], deps = ["kotlinx.serialization"], requires = ["client"] }
# ktor-server-content-negotiation + ktor-serialization-kotlinx-json:
# typed respond<T>() / receive<T>() and ContentNegotiation { json() }.
server-serialization = { sources = ["shim/server-serialization"], deps = ["kotlinx.serialization"], requires = ["server"] }

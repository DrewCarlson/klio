# Event bus (`io.ktor.events.Events`) — `HttpClient.monitor`. Ungated (core).
[[source]]
root = "upstream/ktor-shared/ktor-events/common/src"
include = [
    "io/ktor/events/Events.kt",
]

# Platform `actual`s for the ktor-http `expect`s. The posix variant is pure
# common Kotlin (no JVM/JS imports): `URLBuilder.Companion.origin`.
[[source]]
root = "upstream/ktor-http/posix/src"
include = [
    "io/ktor/http/URLBuilderPosix.kt",
]

# Client-core foundation (cores stage 1 — engine boundary). These are the
# client-core types with no `shim/client` equivalent, so they sit in core
# without colliding: `EmptyContent` (request-body default), the engine config
# base, and the engine-capability interface (`HttpClientEngineCapability`'s
# eager `DEFAULT_CAPABILITIES` references the not-yet-consumed timeout plugin;
# klio defers a missing-symbol top-level-val init to on-access). Client types
# that DO shadow the shim (`HttpRequestBuilder`/`HttpResponse`/`HttpClient`)
# wait for the stage-3 feature swap.
[[source]]
root = "upstream/ktor-client/ktor-client-core/common/src"
include = [
    "io/ktor/client/utils/Content.kt",
    "io/ktor/client/engine/HttpClientEngineConfig.kt",
    "io/ktor/client/engine/HttpClientEngineCapability.kt",
    "io/ktor/client/engine/HttpClientEngine.kt",
    "io/ktor/client/engine/HttpClientEngineBase.kt",
    "io/ktor/client/engine/HttpClientEngineFactory.kt",
    "io/ktor/client/engine/Utils.kt",
    # Upstream client core (request/statement/call layers). These shadow
    # `shim/client` declarations, so they are gated under the `client-upstream`
    # feature (the stage-3 swap that replaces `shim/client`) rather than core —
    # otherwise they collide with the shim under `--feature client`.
    "io/ktor/client/content/ObservableContent.kt",
    "io/ktor/client/request/RequestBody.kt",
    "io/ktor/client/request/HttpRequest.kt",
    "io/ktor/client/request/DefaultHttpRequest.kt",
    "io/ktor/client/request/HttpRequestPipeline.kt",
    "io/ktor/client/statement/HttpResponse.kt",
    "io/ktor/client/statement/DefaultHttpResponse.kt",
    "io/ktor/client/statement/HttpResponsePipeline.kt",
    "io/ktor/client/call/HttpClientCall.kt",
    "io/ktor/client/call/SavedCall.kt",
    "io/ktor/client/call/DelegatedCall.kt",
    "io/ktor/client/call/utils.kt",
    "io/ktor/client/HttpClientConfig.kt",
    "io/ktor/client/HttpClient.kt",
    "io/ktor/client/plugins/HttpClientPlugin.kt",
    "io/ktor/client/plugins/api/ClientHook.kt",
    "io/ktor/client/plugins/api/ClientPluginBuilder.kt",
    "io/ktor/client/plugins/api/ClientPluginInstance.kt",
    "io/ktor/client/plugins/api/CommonHooks.kt",
    "io/ktor/client/plugins/api/CreatePluginUtils.kt",
    "io/ktor/client/plugins/api/KtorCallContexts.kt",
    "io/ktor/client/plugins/HttpRequestLifecycle.kt",
    "io/ktor/client/plugins/BodyProgress.kt",
    "io/ktor/client/plugins/SaveBody.kt",
    "io/ktor/client/plugins/DefaultTransform.kt",
    "io/ktor/client/plugins/HttpSend.kt",
    "io/ktor/client/plugins/HttpCallValidator.kt",
    "io/ktor/client/plugins/HttpRedirect.kt",
    "io/ktor/client/plugins/HttpPlainText.kt",
    "io/ktor/client/plugins/DefaultResponseValidation.kt",
    "io/ktor/client/plugins/HttpTimeout.kt",
    "io/ktor/client/utils/ClientEvents.kt",
    "io/ktor/client/request/builders.kt",
    "io/ktor/client/request/buildersWithUrl.kt",
    "io/ktor/client/request/utils.kt",
    "io/ktor/client/statement/HttpStatement.kt",
    "io/ktor/client/statement/Readers.kt",
]
# Default auto-binding prefix is `io.ktor.`, covering both the client
# (`io.ktor.client.engine.*`) and server (`io.ktor.server.engine.*`)
# native engine helpers.

[[deps]]
id = "stdlib"

# Pipeline runtime deps: coroutines (`PipelineContext : CoroutineScope`,
# suspend `proceed`) and atomicfu (`Pipeline`'s `by atomic(...)`).
[[deps]]
id = "kotlinx.coroutines"

[[deps]]
id = "kotlinx.atomicfu"

# `io.ktor.utils.io` channel types (`ByteReadChannel`/`ByteWriteChannel`) and
# the `OutgoingContent` body layer are backed by kotlinx.io `Buffer`/`Source`.
[[deps]]
id = "kotlinx.io"

# Cargo-style features mirroring ktor's Gradle module structure. The
# core (io.ktor.http types under shim/core) is ungated and always loads;
# everything else is opt-in via `--feature io.ktor/<name>`. The
# *-serialization features pull the kotlinx.serialization pack only when
# enabled, so a plain client/server program needs no serializer.
[features]
default = []
# ktor-client-core: HttpClient + request/response builder DSL.
client = { sources = ["shim/client"] }
# Staged upstream client-core consumption (stage 3 — see plans/KTOR-UPSTREAM).
# Gates the real upstream client files that shadow `shim/client`; building up
# here in parallel keeps the shim `client` feature working until the swap is
# complete (then `client` points here and `shim/client` is deleted).
client-upstream = { sources = [
    "upstream/ktor-client/ktor-client-core/common/src/io/ktor/client/utils/ClientEvents.kt",
    "upstream/ktor-client/ktor-client-core/common/src/io/ktor/client/content/",
    "upstream/ktor-client/ktor-client-core/common/src/io/ktor/client/request/",
    "upstream/ktor-client/ktor-client-core/common/src/io/ktor/client/statement/",
    "upstream/ktor-client/ktor-client-core/common/src/io/ktor/client/call/",
    "upstream/ktor-client/ktor-client-core/common/src/io/ktor/client/plugins/",
    "upstream/ktor-client/ktor-client-core/common/src/io/ktor/client/HttpClient.kt",
    "upstream/ktor-client/ktor-client-core/common/src/io/ktor/client/HttpClientConfig.kt",
    "shim/client-upstream",
] }
# ktor-server-core: embeddedServer + routing + respondText.
server = { sources = ["shim/server"] }
# ktor-client-content-negotiation + ktor-serialization-kotlinx-json:
# typed body<T>() / setBody<T>() and ContentNegotiation { json() }. Pulls
# the serialization pack's `json` feature (its core alone has no Json).
client-serialization = { sources = ["shim/client-serialization"], deps = ["kotlinx.serialization/json"], requires = ["client"] }
# ktor-server-content-negotiation + ktor-serialization-kotlinx-json:
# typed respond<T>() / receive<T>() and ContentNegotiation { json() }.
server-serialization = { sources = ["shim/server-serialization"], deps = ["kotlinx.serialization/json"], requires = ["server"] }

[library]
id = "io.ktor.client"
version = "3.2.0"
abi = 1
implicit_packages = []
source_roots = ["shim"]
auto_bindings = true
# ktor's engine helpers live under io.ktor.client.engine — that
# subpackage matches `<id>.` so the auto-binding prefix derived
# from `id` picks them up.

[[deps]]
id = "stdlib"

[[deps]]
id = "kotlinx.serialization"

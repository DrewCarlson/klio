[library]
id = "kotlinx.datetime"
version = "0.8.0"
abi = 1
implicit_packages = []
auto_bindings = true

# Upstream kotlinx-datetime 0.8.0 core commonMain, consumed straight
# from the in-pack git submodule. `include` curates exactly the files
# klio can parse + resolve verbatim with no machinery it lacks: the
# self-contained Month / DayOfWeek enums + factories and the public
# exception types.
#
# Every datetime value-type source file (LocalDate.kt, Instant.kt,
# LocalDateTime.kt, LocalTime.kt, TimeZone.kt, DateTimePeriod.kt,
# DateTimeUnit.kt, UtcOffset.kt, YearMonth.kt, Clock.kt) and every
# `serializers/*.kt` file fails to *parse* under klio: they use syntax
# klio's parser does not yet accept (qualified function-type receivers
# `A.B.() -> Unit`, qualified anonymous-object supertypes, nested-type
# params in `(x: A.B)` position). This is a pre-existing klio parser
# limitation independent of kotlinx-serialization, so the value types
# stay klio-supplied (klioMain cannot shrink until the parser grows
# those forms). The serializers that *do* parse
# (DateTimePeriod/DayOfWeek/Instant/TimeZone) still cannot *run*: they
# need the format parser-combinator DSL, `kotlin.time.Instant`, the
# excluded reified-generic serializer factories, or
# `buildClassSerialDescriptor` (whose body hits a klio `vararg.toList`
# interpreter gap). The pack now depends on kotlinx.serialization so
# datetime value types are reflectively `@Serializable`-serializable
# (see the serialization pack's reflective KSerializer); the
# consumer-facing value-type surface is still supplied by klioMain.
[[source]]
root = "upstream/core/common/src"
include = [
    "Month.kt",
    "DayOfWeek.kt",
    "Exceptions.kt",
    "OverloadMarker.kt",
]

# klio-supplied platform layer. Declares the value types and operators
# (Instant, LocalDate/Time/DateTime, TimeZone, Duration, Clock,
# DateTimePeriod, DateTimeUnit, conversions) that upstream commonMain
# only declares as `expect`. Bodies are thin Kotlin over the Rust host
# bindings in src/lib.rs (system clock, chrono-backed tz conversion,
# ISO parse/format, calendar arithmetic). Month / DayOfWeek are NOT
# redeclared here; they come from the real upstream files above.
[[source]]
root = "klioMain"

[[deps]]
id = "stdlib"

[[deps]]
id = "kotlinx.serialization"

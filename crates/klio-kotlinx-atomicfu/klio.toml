[library]
id = "kotlinx.atomicfu"
version = "0.32.1"
abi = 1
implicit_packages = []
source_roots = ["shim"]
# Rust crate's `host_bindings()` already declares every binding —
# auto_bindings asks the pack builder to pull them straight from
# the merged host registry so we don't duplicate the list here.
auto_bindings = true

[[deps]]
id = "stdlib"

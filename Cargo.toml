[workspace]
resolver = "3"
members = [
    "crates/klio-span",
    "crates/klio-diagnostics",
    "crates/klio-lexer",
    "crates/klio-ast",
    "crates/klio-parser",
    "crates/klio-runtime",
    "crates/klio-types",
    "crates/klio-resolver",
    "crates/klio-typeck",
    "crates/klio-cfa",
    "crates/klio-pack",
    "crates/klio-stdlib",
    "crates/klio-stdlib-pack",
    "crates/klio-stdlib-gen",
    "crates/klio-kotlinx-coroutines",
    "crates/klio-kotlinx-atomicfu",
    "crates/klio-kotlinx-datetime",
    "crates/klio-kotlinx-io",
    "crates/klio-interp",
    "crates/klio-cli",
    "crates/klio-parity",
    "crates/klio-diagnostics-gen",
    "crates/klio-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DrewCarlson/kt-exp"

[workspace.dependencies]
klio-span        = { path = "crates/klio-span" }
klio-diagnostics = { path = "crates/klio-diagnostics" }
klio-lexer       = { path = "crates/klio-lexer" }
klio-ast         = { path = "crates/klio-ast" }
klio-parser      = { path = "crates/klio-parser" }
klio-runtime     = { path = "crates/klio-runtime" }
klio-types       = { path = "crates/klio-types" }
klio-resolver    = { path = "crates/klio-resolver" }
klio-typeck      = { path = "crates/klio-typeck" }
klio-cfa         = { path = "crates/klio-cfa" }
klio-pack        = { path = "crates/klio-pack" }
klio-stdlib      = { path = "crates/klio-stdlib" }
klio-stdlib-pack = { path = "crates/klio-stdlib-pack" }
klio-kotlinx-coroutines = { path = "crates/klio-kotlinx-coroutines" }
klio-kotlinx-atomicfu   = { path = "crates/klio-kotlinx-atomicfu" }
klio-kotlinx-datetime   = { path = "crates/klio-kotlinx-datetime" }
klio-kotlinx-io         = { path = "crates/klio-kotlinx-io" }
klio-interp      = { path = "crates/klio-interp" }

thiserror      = "2"
ariadne        = "0.6.0"
unicode-ident  = "1"
unicode-xid    = "0.2"
clap           = { version = "4", features = ["derive"] }
rustyline      = "18.0.0"
insta          = { version = "1", features = ["yaml"] }
criterion      = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
dhat           = "0.3"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = 1
